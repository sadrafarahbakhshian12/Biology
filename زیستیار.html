<style>

:root{

}

  --bg:#08130f; --bg2:#0d1d18; --fg:#e4f3ed; --muted:#93b3a9; --card:#10241e; --line:#21433a;
  --glow:#3fe0bd; --L:.78; --C:.16; --Lt:.26; --hero1:#04100c; --hero2:#0a2a22; color-scheme:dark}}
:root[data-theme="dark"]{

*{box-sizing:border-box}

body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--hero1)}
button{font-family:inherit}
:focus-visible{outline:3px solid var(--glow);outline-offset:2px;border-radius:8px}

/* hero */
.hero{position:relative;background:radial-gradient(120% 130% at 15% 0%,var(--hero2),var(--hero1) 70%);color:var(--herofg);overflow:hidden}
.hero canvas{position:absolute;inset:0;width:100%;height:100%;display:block}

h1{font-family:var(--disp);font-weight:400;font-size:clamp(3.6rem,13vw,8rem);line-height:1.15;margin:.1em 0;text-wrap:balance;
  background:linear-gradient(100deg,#fff 5%,#7ff0d4 40%,#ffe56a 75%,#ff9ad5);-webkit-background-clip:text;background-clip:text;color:transparent}

.byline{display:inline-flex;align-items:center;gap:12px;padding:9px 20px;border:1px solid #3c9a85;border-radius:999px;background:rgba(5,25,20,.55);backdrop-filter:blur(4px)}
.byline b{font-family:var(--disp);font-weight:400;font-size:1.3rem;color:#ffe56a}

.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}

.chip{--ac:oklch(var(--L) var(--C) var(--h));flex:none;border:1.5px solid var(--ac);background:transparent;color:var(--fg);border-radius:999px;padding:1px 13px;font-size:.84rem;cursor:pointer;line-height:1.8}

.search{flex:1 1 280px;min-width:0}
.search input{width:100%;font:inherit;padding:12px 18px;border-radius:16px;border:2px solid var(--line);background:var(--card);color:var(--fg)}
.search input:focus{border-color:var(--glow);outline:none}
.progress{flex:1 1 220px;min-width:0;font-size:.88rem;color:var(--muted)}
.bar{height:9px;border-radius:99px;background:var(--bg2);border:1px solid var(--line);overflow:hidden;margin-top:6px}

.sec-sub{margin:0 0 16px;color:var(--muted);font-size:.95rem}
.map{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,255px),1fr));gap:16px;padding-bottom:10px}
.ccard{--a:oklch(.56 .2 var(--h));--b:oklch(.4 .17 calc(var(--h) + 40));position:relative;overflow:hidden;text-align:start;border:0;border-radius:24px;padding:18px 20px 16px;color:#fff;cursor:pointer;
  background:radial-gradient(circle at 12% 110%,rgba(255,255,255,.28) 0 14%,transparent 15%),radial-gradient(circle at 92% -10%,rgba(255,255,255,.2) 0 22%,transparent 23%),linear-gradient(145deg,var(--a),var(--b));
  display:flex;flex-direction:column;gap:6px;min-height:200px;transition:transform .2s,box-shadow .2s;box-shadow:0 8px 22px -14px var(--a)}
.ccard:hover{transform:translateY(-4px);box-shadow:0 16px 30px -14px var(--a)}
.ccard small{font-size:.78rem;opacity:.9;letter-spacing:.02em}

.ccard .pb i{display:block;height:100%;background:#fff}
.results{display:none;gap:10px;flex-direction:column;padding-bottom:10px}
.res{--ac:oklch(var(--L) var(--C) var(--h));text-align:start;border:1px solid var(--line);border-inline-start:6px solid var(--ac);border-radius:14px;background:var(--card);color:var(--fg);padding:10px 16px;cursor:pointer}
.res b{display:block}.res span{font-size:.85rem;color:var(--muted)}
.res em{font-style:normal;color:var(--ac);font-size:.8rem}

/* chapter view */
.cv{--ac:oklch(var(--L) var(--C) var(--h));--ac2:oklch(var(--L) var(--C) calc(var(--h) + 50));--soft:oklch(var(--Lt) .06 var(--h))}
.band{--a:oklch(.52 .2 var(--h));--b:oklch(.34 .15 calc(var(--h) + 45));color:#fff;background:radial-gradient(circle at 8% 120%,rgba(255,255,255,.22) 0 16%,transparent 17%),radial-gradient(circle at 96% -20%,rgba(255,255,255,.18) 0 24%,transparent 25%),linear-gradient(140deg,var(--a),var(--b))}
.band .wrap{padding-block:22px 28px}
.back{border:1px solid rgba(255,255,255,.55);background:rgba(255,255,255,.14);color:#fff;border-radius:99px;padding:3px 16px;cursor:pointer;font-size:.9rem}
.band .scale{display:flex;align-items:center;gap:12px;font-size:.8rem;margin-top:16px;opacity:.95}
.band .rule{flex:1;height:14px;min-width:30px;border-bottom:2px solid #fff;background:repeating-linear-gradient(90deg,#fff 0 2px,transparent 2px 12px) 0 100%/100% 8px no-repeat,repeating-linear-gradient(90deg,#fff 0 2px,transparent 2px 60px) 0 100%/100% 14px no-repeat}
.band h2{font-family:var(--disp);font-weight:400;font-size:clamp(2.2rem,6vw,3.8rem);line-height:1.3;margin:10px 0 0}
.band p{max-width:46em;margin:4px 0 0;color:#ffffffe6}
.layout{display:grid;grid-template-columns:270px minmax(0,1fr);gap:22px;padding-block:24px 10px;align-items:start}
.list{position:sticky;top:calc(64px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:8px}
.li{--k:oklch(var(--L) var(--C) calc(var(--h) + var(--n)*16));display:flex;align-items:center;gap:10px;text-align:start;width:100%;border:1.5px solid var(--line);background:var(--card);color:var(--fg);border-radius:14px;padding:8px 12px;cursor:pointer;font-size:.95rem;line-height:1.6}
.li .d{flex:none;width:14px;height:14px;border-radius:50%;background:var(--k);box-shadow:0 0 0 4px color-mix(in srgb,var(--k) 22%,transparent)}
.li:hover{border-color:var(--k)}
.li.on{background:var(--k);border-color:var(--k);color:#fff;font-weight:700}
.li.on .d{background:#fff;box-shadow:0 0 0 4px rgba(255,255,255,.3)}
.li.seen:not(.on)::after{content:"✓";margin-inline-start:auto;color:var(--k);font-weight:800}
.li.sp{border-style:dashed}
.panel{min-width:0;background:var(--card);border:1px solid var(--line);border-radius:26px;padding:24px clamp(16px,3vw,32px) 22px;animation:rise .35s ease both;scroll-margin-top:calc(70px + env(safe-area-inset-top,0px));
  background-image:linear-gradient(180deg,var(--soft),transparent 230px)}
@keyframes rise{from{opacity:.0;transform:translateY(10px)}to{opacity:1;transform:none}}
.panel .kick{font-size:.82rem;color:var(--ac);font-weight:700;display:flex;gap:8px;align-items:center}
.panel .kick i{display:inline-block;width:26px;height:3px;border-radius:3px;background:linear-gradient(90deg,var(--ac),var(--ac2))}
.panel h3{font-family:var(--disp);font-weight:400;font-size:clamp(1.9rem,4.5vw,2.8rem);line-height:1.4;margin:2px 0 10px;background:linear-gradient(100deg,var(--ac),var(--ac2));-webkit-background-clip:text;background-clip:text;color:transparent}
.panel .l1{font-size:1.12rem;font-weight:500;margin:0 0 12px}
.panel p{max-width:46em;margin:0 0 12px}
.panel h4{font-family:var(--disp);font-weight:400;font-size:1.3rem;margin:22px 0 10px;display:flex;align-items:center;gap:8px}
.panel h4::before{content:"";width:12px;height:12px;border-radius:4px;background:var(--ac2);transform:rotate(45deg)}
.keys{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr));gap:12px}
.key{--k:oklch(var(--L) var(--C) calc(var(--h) + var(--n)*55));border-radius:16px;padding:12px 14px;background:color-mix(in srgb,var(--k) 14%,var(--card));border:1.5px solid color-mix(in srgb,var(--k) 55%,transparent);font-size:.95rem;line-height:1.8}
.key b{display:grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--k);color:#fff;font-size:.8rem;margin-bottom:4px}
.ex{border-radius:18px;padding:14px 18px;background:linear-gradient(135deg,color-mix(in srgb,var(--ac) 20%,var(--card)),color-mix(in srgb,var(--ac2) 20%,var(--card)));border:1.5px dashed var(--ac)}
.ex b{color:var(--ac);font-family:var(--disp);font-weight:400;font-size:1.1rem;margin-inline-end:6px}
.terms{display:flex;gap:8px;flex-wrap:wrap}
.terms span{--k:oklch(var(--L) var(--C) calc(var(--h) + var(--n)*40));font-size:.82rem;padding:1px 14px;border-radius:99px;background:var(--k);color:#fff;font-weight:500}
.pager{display:flex;justify-content:space-between;gap:10px;margin-top:22px;flex-wrap:wrap}
.pg{border:1.5px solid var(--ac);background:transparent;color:var(--fg);border-radius:99px;padding:4px 18px;cursor:pointer;font-size:.92rem}
.pg:hover{background:var(--ac);color:#fff}
.bigfact{font-size:1.2rem;line-height:2;max-width:40em}
.bigfact::first-letter{color:var(--ac)}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:10px}
.opt{font-size:1rem;text-align:start;padding:10px 16px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);color:var(--fg);cursor:pointer}
.opt:hover:not([disabled]){border-color:var(--ac);background:color-mix(in srgb,var(--ac) 10%,var(--card))}
.opt.ok{border-color:#1f9d55;background:color-mix(in srgb,#1f9d55 24%,var(--card))}
.opt.no{border-color:#d1493f;background:color-mix(in srgb,#d1493f 20%,var(--card))}
.qtext{font-size:1.1rem;font-weight:700;margin:6px 0 12px}
.expl{margin:12px 0 0;font-size:.95rem;color:var(--muted)}
.next{margin-top:12px;padding:6px 22px;border-radius:99px;border:0;background:linear-gradient(100deg,var(--ac),var(--ac2));color:#fff;cursor:pointer;font-weight:700;font-size:.95rem}
.empty{display:none;text-align:center;padding:40px 0;color:var(--muted)}
footer{margin-top:50px;background:var(--hero1);color:var(--herofg);padding-block:36px calc(36px + env(safe-area-inset-bottom,0px))}
footer .wrap{display:flex;gap:20px;justify-content:space-between;align-items:center;flex-wrap:wrap}
footer b{font-family:var(--disp);font-weight:400;font-size:1.7rem;color:#ffe56a}
footer p{margin:0;color:#a6e0d0;font-size:.9rem}
@media (max-width:820px){
  .layout{grid-template-columns:minmax(0,1fr);gap:14px}
  .list{position:static;flex-direction:row;overflow-x:auto;padding-bottom:6px;scrollbar-width:thin}
  .li{width:auto;flex:none;white-space:nowrap}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
</style>

topics:[

["پروتئین‌ها","پروتئین‌ها زنجیره‌ای از آمینواسیدها هستند که به شکل سه‌بعدی خاصی تا می‌خورند. شکل آن‌ها کارشان را تعیین می‌کند؛ آنزیم، پادتن، ناقل و ماده‌ی ساختاری. ۲۰ آمینواسید متفاوت در ساختار آن‌ها به کار می‌رود.",["آمینواسید","پیوند پپتیدی","ساختار سوم"]],
["نوکلئیک‌اسیدها","DNA و RNA از نوکلئوتیدها ساخته شده‌اند و اطلاعات وراثتی را ذخیره و منتقل می‌کنند. ATP نیز یک نوکلئوتید است و ارز انرژی سلول به شمار می‌رود.",["DNA","RNA","ATP","نوکلئوتید"]],
["آنزیم‌ها","آنزیم‌ها کاتالیزورهای زیستی‌اند و با کاهش انرژی فعال‌سازی سرعت واکنش را هزاران برابر می‌کنند. هر آنزیم جایگاه فعال ویژه‌ای دارد و دما، pH و بازدارنده‌ها بر آن اثر می‌گذارند.",["جایگاه فعال","پیش‌ماده","بازدارنده"]]],

{q:"واحد سازنده‌ی پروتئین‌ها کدام است؟",o:["نوکلئوتید","اسید چرب","آمینواسید","مونوساکارید"],a:2,e:"پروتئین‌ها پلیمر آمینواسیدها هستند."},

topics:[
["سلول پیش‌هسته‌ای و هسته‌دار","باکتری‌ها و آرکی‌ها هسته‌ی مجزا ندارند و DNA حلقوی آن‌ها در سیتوپلاسم است. سلول‌های یوکاریوتی (جانوران، گیاهان، قارچ‌ها، آغازیان) هسته و اندامک‌های غشادار دارند.",["پروکاریوت","یوکاریوت","نوکلئوئید"]],
["اندامک‌ها","هسته مرکز فرمان است، میتوکندری انرژی می‌سازد، شبکه‌ی آندوپلاسمی و گلژی پروتئین را می‌سازند و بسته‌بندی می‌کنند، لیزوزوم‌ها هضم می‌کنند و کلروپلاست در گیاهان فتوسنتز می‌کند.",["میتوکندری","گلژی","لیزوزوم","کلروپلاست","ریبوزوم"]],
["غشای سلولی","غشا از دولایه‌ی فسفولیپیدی و پروتئین‌های شناور ساخته شده و نفوذپذیری انتخابی دارد. مدل موزاییک سیال آن را توصیف می‌کند.",["موزاییک سیال","کانال","پمپ سدیم-پتاسیم"]],
["انتقال مواد","انتشار و اسمز بدون مصرف انرژی انجام می‌شوند. انتقال فعال با مصرف ATP مواد را خلاف شیب غلظت جابه‌جا می‌کند. اندوسیتوز و اگزوسیتوز ذره‌های بزرگ را جابه‌جا می‌کنند.",["اسمز","انتشار تسهیل‌شده","انتقال فعال"]],
["تنفس سلولی و فتوسنتز","در تنفس سلولی گلوکز طی گلیکولیز، چرخه‌ی کربس و زنجیره‌ی انتقال الکترون تا حدود ۳۰ ATP می‌دهد. فتوسنتز برعکس، انرژی نور را در قند ذخیره می‌کند.",["گلیکولیز","چرخه‌ی کربس","ATP سنتاز"]],
["چرخه‌ی سلولی و تقسیم","میتوز یک سلول را به دو سلول یکسان می‌شکند و برای رشد و ترمیم است. میوز چهار سلول با نصف کروموزوم می‌سازد و تنوع ژنتیکی ایجاد می‌کند. کنترل نادرست چرخه به سرطان می‌انجامد.",["میتوز","میوز","نقطه‌ی وارسی","کراسینگ‌اور"]]],
fact:"در بدن شما هر ثانیه حدود دو میلیون گلبول قرمز تازه ساخته می‌شود، و همه‌ی سلول‌های بدن از یک سلول تخم آغاز شده‌اند.",
quiz:[
{q:"کدام اندامک بیشترین ATP را تولید می‌کند؟",o:["گلژی","لیزوزوم","میتوکندری","ریبوزوم"],a:2,e:"میتوکندری جایگاه زنجیره‌ی انتقال الکترون و بیشترین تولید ATP است."},
{q:"میوز در پایان چند سلول می‌دهد؟",o:["۲ سلول یکسان","۴ سلول با نصف کروموزوم","۴ سلول یکسان","۸ سلول"],a:1,e:"میوز با دو تقسیم، چهار هاپلوئید متفاوت می‌سازد."},
{q:"حرکت آب از محیط رقیق به غلیظ از غشای نیمه‌تراوا چه نام دارد؟",o:["اسمز","انتقال فعال","اگزوسیتوز","همانندسازی"],a:0,e:"اسمز انتشار آب است."}]},

{id:"gen",h:280,name:"ژنتیک و زیست‌شناسی مولکولی",hl:"ژنتیک",tag:"وراثت",scale:"۲ نانومتر تا ۱۰ میکرومتر",
intro:"ژنتیک می‌پرسد صفات چگونه از نسلی به نسل بعد می‌رسند. زیست‌شناسی مولکولی نشان می‌دهد این اطلاعات چگونه خوانده و به پروتئین تبدیل می‌شود.",
topics:[
["ساختار DNA","دو رشته‌ی پادموازی که به شکل مارپیچ دوگانه پیچیده‌اند. بازهای A با T و G با C جفت می‌شوند. توالی بازها اطلاعات ژنتیکی را رمز می‌کند.",["مارپیچ دوگانه","جفت‌باز","کروماتین"]],
["همانندسازی","DNA به صورت نیمه‌حفاظتی همانندسازی می‌شود. هلیکاز رشته‌ها را باز می‌کند و DNA پلیمراز رشته‌ی جدید می‌سازد. دقت آن حدود یک خطا در میلیاردها باز است.",["هلیکاز","DNA پلیمراز","نیمه‌حفاظتی"]],
["دگم مرکزی","DNA به RNA رونویسی و سپس RNA در ریبوزوم به پروتئین ترجمه می‌شود. هر سه باز یک رمزه (کدون) است و یک آمینواسید را مشخص می‌کند.",["رونویسی","ترجمه","کدون","tRNA"]],
["وراثت مندلی","مندل با نخود فرنگی نشان داد هر صفت را دو اَلل تعیین می‌کند. اَلل غالب بر نهفته چیره می‌شود. قانون جداشدن و قانون جور شدن مستقل از آزمایش‌های او می‌آیند.",["غالب","نهفته","مربع پانت","هتروزیگوت"]],
["فراتر از مندل","هم‌توانی، بارزی ناقص، چندآللی، پیوستگی ژنی و وراثت وابسته به جنس، الگوهای پیچیده‌تری می‌سازند. گروه خونی ABO نمونه‌ی هم‌توانی و چندآللی است.",["هم‌توانی","وابسته به X","پیوستگی"]],
["جهش و ژن‌درمانی","جهش تغییر پایدار در توالی DNA است. برخی مضر، برخی خنثی و بعضی سودمندند. فناوری CRISPR-Cas9 اکنون می‌تواند ژن را با دقت ویرایش کند.",["جهش نقطه‌ای","CRISPR","اپی‌ژنتیک"]]],
fact:"ژنوم انسان حدود سه میلیارد جفت باز دارد، اما فقط حدود دو درصد آن پروتئین می‌سازد.",
quiz:[
{q:"در RNA به جای تیمین کدام باز است؟",o:["آدنین","اوراسیل","سیتوزین","گوانین"],a:1,e:"RNA اوراسیل (U) دارد."},
{q:"از تلاقی دو والد هتروزیگوت (Aa×Aa) چه نسبت فنوتیپی داریم؟",o:["۱:۱","۱:۲:۱","۳:۱","۹:۳:۳:۱"],a:2,e:"سه غالب در برابر یک نهفته."},
{q:"ترجمه در کجا انجام می‌شود؟",o:["هسته","ریبوزوم","گلژی","لیزوزوم"],a:1,e:"ریبوزوم‌ها mRNA را می‌خوانند و آمینواسیدها را به هم می‌چسبانند."}]},

{id:"mic",h:100,name:"میکروب‌ها و ایمنی",hl:"ایمنی",tag:"میکروب‌شناسی",scale:"۰٫۱ تا ۱۰ میکرومتر",
intro:"جهان نامرئی میکروب‌ها بیشترین زیست‌توده‌ی زمین را دارد. بیشتر آن‌ها بی‌خطر یا سودمندند و فقط تعداد کمی بیماری‌زا هستند.",
topics:[
["باکتری‌ها","تک‌سلولی‌های پیش‌هسته‌ای که با تقسیم دوتایی می‌افزایند. شکل‌هایی چون کروی، میله‌ای و مارپیچی دارند. روده‌ی انسان خانه‌ی میلیاردها باکتری مفید است.",["دیواره‌ی پپتیدوگلیکان","گرم مثبت","میکروبیوم"]],
["ویروس‌ها","ذره‌هایی از ماده‌ی ژنتیکی درون پوشش پروتئینی که فقط درون سلول میزبان تکثیر می‌شوند. بیشتر زیست‌شناسان آن‌ها را مرز زنده و غیرزنده می‌دانند.",["کپسید","باکتریوفاژ","رتروویروس"]],
["قارچ‌ها و آغازیان","مخمرها، کپک‌ها و قارچ‌های خوراکی یوکاریوتی‌اند و غذا را از بیرون جذب می‌کنند. آغازیانی مانند آمیب و پلاسمودیوم (عامل مالاریا) تک‌سلولی هستند.",["مخمر","هیف","پلاسمودیوم"]],
["ایمنی ذاتی","اولین خط دفاع: پوست، مخاط، اسید معده، گلبول‌های سفید بیگانه‌خوار و التهاب. پاسخ سریع و غیراختصاصی است.",["ماکروفاژ","التهاب","اینترفرون"]],
["ایمنی اکتسابی","لنفوسیت‌های B پادتن می‌سازند و T کشنده سلول‌های آلوده را نابود می‌کنند. بعد از آشنایی با عامل بیماری، سلول‌های حافظه سرعت پاسخ بعدی را بالا می‌برند.",["پادتن","لنفوسیت T","حافظه‌ی ایمنی"]],
["واکسن و آنتی‌بیوتیک","واکسن سامانه‌ی ایمنی را بدون بیماری آموزش می‌دهد. آنتی‌بیوتیک‌ها فقط بر باکتری‌ها اثر دارند و مصرف نابجای آن‌ها مقاومت دارویی ایجاد می‌کند.",["مقاومت دارویی","ایمنی جمعی","mRNA"]]],
fact:"شمار باکتری‌های بدن انسان تقریباً هم‌اندازه‌ی سلول‌های خود ماست.",
quiz:[
{q:"آنتی‌بیوتیک بر کدام عامل اثر دارد؟",o:["ویروس","باکتری","همه‌ی میکروب‌ها","سرطان"],a:1,e:"آنتی‌بیوتیک‌ها بر ویروس‌ها اثری ندارند."},
{q:"تولید پادتن وظیفه‌ی کدام سلول است؟",o:["لنفوسیت B","ماکروفاژ","پلاکت","گلبول قرمز"],a:0,e:"لنفوسیت B (به شکل پلاسماسل) پادتن ترشح می‌کند."},
{q:"ویروس‌ها برای تکثیر به چه چیزی نیاز دارند؟",o:["نور","سلول میزبان","خاک","اکسیژن آزاد"],a:1,e:"آن‌ها متابولیسم مستقل ندارند."}]},

{id:"plant",h:135,name:"دنیای گیاهان",hl:"گیاهان",tag:"گیاه‌شناسی",scale:"۱ میلی‌متر تا ۱۰۰ متر",
intro:"گیاهان با فتوسنتز نور خورشید را به غذا تبدیل می‌کنند و پایه‌ی بیشتر زنجیره‌های غذایی خشکی هستند.",
topics:[
["ساختار گیاه","ریشه آب و املاح را جذب می‌کند، ساقه آن‌ها را می‌رساند و برگ مرکز فتوسنتز است. بافت‌های سامانه‌ی آوندی، چوب (آب) و آبکش (شیره‌ی پرورده) هستند.",["آوند چوبی","آبکش","روزنه"]],
["فتوسنتز","در واکنش‌های نوری، انرژی نور ATP و NADPH می‌سازد. در چرخه‌ی کالوین، CO₂ به قند تبدیل می‌شود. اکسیژن حاصل از شکافتن آب است.",["کلروفیل","چرخه‌ی کالوین","تیلاکوئید"]],
["رده‌های گیاهی","خزه‌ها بدون آوند، سرخس‌ها آوندی بی‌دانه، بازدانگان دانه‌ی لخت و نهان‌دانگان گل‌دار هستند. نهان‌دانگان بزرگ‌ترین گروه گیاهی‌اند.",["خزه","سرخس","بازدانگان","نهان‌دانگان"]],
["گل و تولیدمثل","گرده‌افشانی با باد یا جانوران انجام می‌شود. لقاح مضاعف نهان‌دانگان دانه و درون‌دانه می‌سازد. میوه از تخمدان گل پدید می‌آید.",["لقاح مضاعف","گرده‌افشانی","میوه"]],
["هورمون‌های گیاهی","اکسین رشد و نورگرایی را هدایت می‌کند، جیبرلین جوانه‌زنی، سیتوکینین تقسیم سلولی، اتیلن رسیدن میوه و آبسزیک‌اسید خواب و بستن روزنه را.",["اکسین","اتیلن","نورگرایی"]],
["سازگاری‌ها","کاکتوس‌ها با ذخیره‌ی آب و گیاهان گوشتخوار با به دام انداختن حشره در خاک فقیر سازگار شده‌اند. گیاهان CAM شب‌ها روزنه را باز می‌کنند.",["CAM","گیاه گوشتخوار","همزیستی ریشه"]]],
fact:"یک درخت بزرگ در روز تابستان صدها لیتر آب از برگ‌ها تعرق می‌کند.",
quiz:[
{q:"اکسیژن آزاد شده در فتوسنتز از کدام ماده می‌آید؟",o:["CO₂","گلوکز","آب","نور"],a:2,e:"با شکافت نوری آب اکسیژن آزاد می‌شود."},
{q:"شیره‌ی پرورده در کدام آوند حرکت می‌کند؟",o:["چوبی","آبکش","روزنه","کامبیوم"],a:1,e:"آبکش قندها را از برگ به بقیه‌ی گیاه می‌رساند."},
{q:"کدام هورمون رسیدن میوه را تسریع می‌کند؟",o:["اتیلن","اکسین","جیبرلین","سیتوکینین"],a:0,e:"اتیلن گازی است که رسیدن را سرعت می‌دهد."}]},

{id:"anim",h:75,name:"جانوران",hl:"جانوران",tag:"جانورشناسی",scale:"۱ میلی‌متر تا ۳۰ متر",
intro:"جانوران پریاخته‌ای‌های هتروتروف‌اند که حرکت و حس دارند. از اسفنج‌های ساده تا پستانداران، همگی تاریخ تکاملی مشترکی دارند.",
topics:[
["بی‌مهرگان","بیش از ۹۵ درصد گونه‌های جانوری مهره ندارند: اسفنج‌ها، مرجانیان، کرم‌ها، نرم‌تنان، بندپایان و خارپوستان. حشرات پرتعدادترین گروه‌اند.",["بندپایان","نرم‌تنان","اسکلت خارجی"]],
["مهره‌داران","ماهی‌ها، دوزیستان، خزندگان، پرندگان و پستانداران ستون مهره دارند. تغییر از ماهی به خشکی با ظهور ریه، دست‌وپا و تخم دارای پوسته همراه بود.",["ستون مهره","آمنیون","خون‌گرم"]],
["تولیدمثل و رشد","تولیدمثل جنسی تنوع می‌سازد و غیرجنسی سریع است. در رشد جنینی، تخم لقاح‌یافته با تقسیمات متوالی به بلاستولا و سپس گاسترولا و لایه‌های جنینی می‌رسد.",["زیگوت","گاسترولا","دگردیسی"]],
["سازگاری‌های حیرت‌انگیز","شتر آب را مدیریت می‌کند، خفاش با پژواک‌یابی می‌بیند و خرس قطبی چربی زیرجلدی و خز ویژه دارد. هر سازگاری حاصل انتخاب طبیعی است.",["پژواک‌یابی","خواب زمستانی","استتار"]],
["دستگاه‌های عصبی","از شبکه‌ی عصبی ساده‌ی عروس دریایی تا مغز پیچیده‌ی پستانداران. رفتارها از بازتاب‌های ساده تا یادگیری و حافظه را شامل می‌شوند.",["نورون","گانگلیون","قشر مخ"]],
["همزیستی","زنبور و گل، مرجان و جلبک، و باکتری‌های روده نمونه‌ی همزیستی‌اند. انگل‌ها به زیان میزبان زندگی می‌کنند.",["مفیدزیستی","انگلی","هم‌سفرگی"]]],
fact:"وزن همه‌ی مورچه‌های زمین از وزن همه‌ی پرندگان وحشی بیشتر برآورد می‌شود.",
quiz:[
{q:"کدام گروه بزرگ‌ترین شمار گونه‌ی جانوری را دارد؟",o:["پستانداران","ماهی‌ها","حشرات","پرندگان"],a:2,e:"حشرات میلیون‌ها گونه دارند."},
{q:"آمنیون در کدام گروه برای نخستین بار ظاهر شد؟",o:["دوزیستان","ماهی‌ها","خزندگان و هم‌رده‌ها","اسفنج‌ها"],a:2,e:"تخم آمنیوتی امکان زندگی کامل در خشکی داد."},
{q:"همزیستی مرجان و جلبک از چه نوع است؟",o:["انگلی","مفیدزیستی","رقابتی","شکارگری"],a:1,e:"هر دو سود می‌برند."}]},

{id:"human",h:20,name:"بدن انسان",hl:"انسان",tag:"فیزیولوژی",scale:"۱ تا ۲ متر",
intro:"بدن انسان مجموعه‌ای از دستگاه‌هاست که هم‌هنگام کار می‌کنند و محیط داخلی را پایدار نگه می‌دارند؛ این پایداری هم‌ایستایی نام دارد.",
topics:[
["گردش خون","قلب چهارحفره‌ای خون را در دو مسیر ریوی و عمومی می‌چرخاند. سرخرگ‌ها از قلب دور می‌کنند و سیاهرگ‌ها به آن برمی‌گردانند. مویرگ‌ها محل تبادل مواد هستند.",["دهلیز","بطن","هموگلوبین"]],
["تنفس","هوا از حلق و نای به نایژه‌ها و کیسه‌های هوایی می‌رسد. در کیسه‌های هوایی O₂ وارد و CO₂ خارج می‌شود. دیافراگم حجم قفسه را تغییر می‌دهد.",["کیسه‌ی هوایی","دیافراگم","تبادل گازها"]],
["گوارش","غذا در دهان، معده، روده‌ی باریک و بزرگ تجزیه و جذب می‌شود. صفرا و لوزالمعده در روده‌ی باریک عمل می‌کنند و بیشتر جذب با پرزها رخ می‌دهد.",["آمیلاز","پپسین","پرز روده"]],
["دستگاه عصبی","مغز و نخاع مرکز پردازش‌اند و اعصاب پیام را می‌رسانند. پیام عصبی با تغییر پتانسیل غشا و ناقل‌های شیمیایی در سیناپس منتقل می‌شود.",["نورون","سیناپس","پتانسیل عمل"]],
["غدد درون‌ریز","هورمون‌ها پیک‌های شیمیایی خون‌اند. انسولین و گلوکاگون قند خون را تنظیم می‌کنند، تیروئید سوخت‌وساز را و هیپوفیز غدد دیگر را فرمان می‌دهد.",["انسولین","هیپوفیز","بازخورد منفی"]],
["کلیه و دفع","کلیه‌ها با نفرون‌ها خون را صاف می‌کنند، آب و املاح را تنظیم و ادرار را می‌سازند. هر کلیه حدود یک میلیون نفرون دارد.",["نفرون","فیلتراسیون","ADH"]],
["اسکلت و ماهیچه","استخوان‌ها از کلسیم و کلاژن ساخته شده‌اند. ماهیچه‌ها با لغزش رشته‌های اکتین و میوزین کوتاه می‌شوند. منبع انرژی آن‌ها ATP است.",["اکتین","میوزین","مفصل"]]],
fact:"قلب شما در عمر یک انسان معمولی چند میلیارد بار می‌تپد، بدون یک روز استراحت.",
quiz:[
{q:"تبادل گازها در کدام بخش ریه انجام می‌شود؟",o:["نای","نایژه","کیسه‌های هوایی","دیافراگم"],a:2,e:"دیواره‌ی نازک کیسه‌ها و مویرگ‌ها تبادل را ممکن می‌کند."},
{q:"کاهش قند خون را کدام هورمون جبران می‌کند؟",o:["انسولین","گلوکاگون","ADH","تیروکسین"],a:1,e:"گلوکاگون قند خون را بالا می‌برد."},
{q:"واحد ساختاری و عملکردی کلیه چیست؟",o:["نورون","نفرون","پرز","آلوئول"],a:1,e:"نفرون خون را صاف می‌کند."}]},

{id:"beh",h:350,name:"رفتار جانوران",hl:"رفتار",tag:"رفتارشناسی",scale:"۱ ثانیه تا یک عمر",
intro:"رفتار کنش جانور در پاسخ به محیط است. بخشی از آن ژنتیکی و بخشی آموخته است، و هر دو تحت انتخاب طبیعی شکل می‌گیرند.",
topics:[
["رفتار غریزی و یادگیری","غریزه بدون آموزش بروز می‌کند، مانند مکیدن نوزاد. یادگیری شامل عادی‌شدن، شرطی‌شدن و نقش‌پذیری است. پاولوف با سگ‌ها شرطی‌شدن کلاسیک را نشان داد.",["شرطی‌شدن","نقش‌پذیری","غریزه"]],
["ارتباط","جانوران با صدا، بو، حرکت و رنگ پیام می‌دهند. رقص زنبور عسل جهت و فاصله‌ی غذا را می‌رساند. فرومون‌ها پیک شیمیایی بین افراد یک گونه‌اند.",["فرومون","رقص زنبور","نشانه"]],
["مهاجرت و ساعت زیستی","پرندگان و لاک‌پشت‌ها با میدان مغناطیسی و ستارگان مسیر می‌یابند. ساعت زیستی ریتم شبانه‌روزی را هماهنگ می‌کند.",["ریتم شبانه‌روزی","جهت‌یابی","مهاجرت"]],
["زندگی اجتماعی","مورچه‌ها و زنبورها کلنی‌هایی با تقسیم کار می‌سازند. گرگ‌ها و فیل‌ها گروه‌های خانوادگی دارند. از دید تکاملی، همکاری گاهی به ژن‌های مشترک بستگی دارد.",["کلنی","ایثار","سلسله‌مراتب"]],
["رفتار جفت‌یابی","نمایش‌های رنگارنگ و آواز نر برای ماده‌ها نشانه‌ی شایستگی ژنتیکی است. انتخاب جنسی گاهی صفاتی را شکل می‌دهد که بقا را دشوار می‌کنند، مانند دم طاووس.",["انتخاب جنسی","قلمروخواهی","پرورش فرزند"]]],
fact:"کلاغ‌های کالدونیای جدید برای بیرون کشیدن حشره از شکاف چوب، از سیم و شاخه ابزار می‌سازند.",
quiz:[
{q:"شرطی‌شدن کلاسیک را چه کسی توصیف کرد؟",o:["مندل","پاولوف","داروین","واتسون"],a:1,e:"پاولوف با سگ‌ها و صدای زنگ."},
{q:"فرومون چیست؟",o:["هورمون خونی","پیک شیمیایی بین افراد","نوعی پادتن","آنزیم گوارشی"],a:1,e:"فرومون‌ها از بدن آزاد می‌شوند و بر رفتار هم‌گونان اثر می‌گذارند."},
{q:"ریتم شبانه‌روزی را چه تنظیم می‌کند؟",o:["ساعت زیستی","فقط گرما","فقط غذا","پادتن"],a:0,e:"ساعت زیستی با نور هماهنگ می‌شود."}]},

{id:"evo",h:310,name:"تکامل",hl:"تکامل",tag:"زیست‌شناسی تکاملی",scale:"میلیون‌ها سال",
intro:"تکامل چارچوب یکپارچه‌ی زیست‌شناسی است. داروین و والاس نشان دادند گونه‌ها با انتخاب طبیعی از نیاکان مشترک پدید آمده‌اند.",
topics:[
["انتخاب طبیعی","افراد یک جمعیت با هم تفاوت دارند، برخی تفاوت‌ها ارثی‌اند و بعضی افراد زادآوری بیشتری دارند. نتیجه، تغییر فراوانی اَلل‌ها در نسل‌هاست.",["شایستگی","تنوع","سازگاری"]],
["شواهد تکامل","فسیل‌ها، آناتومی مقایسه‌ای (اندام‌های همتا و وستیجیال)، شباهت DNA و جغرافیای زیستی همگی از تکامل پشتیبانی می‌کنند.",["فسیل","اندام همتا","ژنوم مقایسه‌ای"]],
["گونه‌زایی","جدایی جغرافیایی جمعیت‌ها و انباشت تفاوت‌های ژنتیکی سرانجام جلوی آمیزش را می‌گیرد و گونه‌ی جدید پدید می‌آید. سیکلیدهای دریاچه‌های آفریقا نمونه‌اند.",["جدایی جغرافیایی","سد تولیدمثلی","تابش سازشی"]],
["رانش و جریان ژن","غیر از انتخاب، رانش ژنی (تصادف در جمعیت‌های کوچک)، جریان ژن و جهش نیز فراوانی اَلل‌ها را تغییر می‌دهند. هاردی-واینبرگ حالت بدون تکامل را توصیف می‌کند.",["رانش ژنی","اثر بنیان‌گذار","هاردی-واینبرگ"]],
["تکامل انسان","انسان خردمند حدود ۳۰۰ هزار سال پیش در آفریقا پدید آمد. نیاکانی چون استرالوپیتکوس و هومواِرکتوس مسیر تکامل ما را نشان می‌دهند.",["هومو ساپینس","دوپایی","نئاندرتال"]],
["درخت زندگی","نمودار فیلوژنی روابط خویشاوندی گونه‌ها را نشان می‌دهد. تبار مشترک همه‌ی موجودات را به هم پیوند می‌دهد.",["نیای مشترک","کلاد","فیلوژنی"]]],
fact:"نهنگ‌ها از نیاکانی چهارپا و خشکی‌زی تکامل یافته‌اند و هنوز استخوان‌های لگن کوچکی دارند.",
quiz:[
{q:"کدام شاخص، موفقیت تولیدمثلی را اندازه می‌گیرد؟",o:["قدرت","شایستگی","سرعت","عمر"],a:1,e:"شایستگی یعنی سهم فرد در نسل بعد."},
{q:"استخوان لگن کوچک نهنگ مثالی از چیست؟",o:["اندام وستیجیال","اندام همتا","جهش تازه","همزیستی"],a:0,e:"اندام وستیجیال کارکرد اصلی را از دست داده است."},
{q:"گونه‌زایی معمولاً با چه چیزی آغاز می‌شود؟",o:["جدایی جمعیت‌ها","افزایش دما","مهاجرت همه","کاهش جهش"],a:0,e:"جدایی جغرافیایی جریان ژن را قطع می‌کند."}]},

{id:"tax",h:245,name:"تنوع زیستی و رده‌بندی",hl:"رده‌بندی",tag:"سیستماتیک",scale:"بیش از ۸ میلیون گونه",
intro:"زیست‌شناسان موجودات را بر پایه‌ی خویشاوندی در گروه‌های تو در تو دسته‌بندی می‌کنند. تنوع زیستی، گوناگونی ژن‌ها، گونه‌ها و بوم‌سازگان‌هاست.",
topics:[
["سه قلمرو حیات","باکتری‌ها، آرکی‌ها و یوکاریوت‌ها. آرکی‌ها اغلب در محیط‌های سخت مانند چشمه‌ی آب گرم و شورزار زندگی می‌کنند.",["آرکی","باکتری","یوکاریا"]],
["سلسله‌مراتب","قلمرو، شاخه، رده، راسته، تیره، سرده و گونه. نام علمی دو‌بخشی (سرده و گونه) را لینه ابداع کرد، مانند Homo sapiens.",["لینه","نام‌گذاری دو‌اسمی","گونه"]],
["مفهوم گونه","گونه گروهی از افراد است که با هم آمیزش می‌کنند و فرزند زایا می‌آورند. این تعریف برای موجودات غیرجنسی یا فسیل‌ها دشوار است.",["گونه‌ی زیستی","دورگه","نژاد"]],
["بحران انقراض","نرخ انقراض کنونی چندین برابر نرخ طبیعی است. تخریب زیستگاه، شکار، گونه‌های مهاجم و تغییر اقلیم مهم‌ترین عوامل‌اند.",["گونه‌ی در خطر","زیستگاه","IUCN"]],
["نقاط داغ تنوع","مناطق گرمسیری مانند جنگل‌های آمازون و بخش‌هایی از آسیا گونه‌های بی‌شماری دارند. ایران نیز چهار اقلیم و گونه‌های بومی فراوان مانند یوزپلنگ آسیایی دارد.",["گونه‌ی بومی","یوزپلنگ","پارک ملی"]]],
fact:"بیشتر گونه‌های زمین هنوز نام‌گذاری نشده‌اند؛ برآوردها از میلیون‌ها گونه‌ی ناشناخته حکایت دارند.",
quiz:[
{q:"نام علمی انسان چیست؟",o:["Homo erectus","Homo sapiens","Pan troglodytes","Canis lupus"],a:1,e:"سرده‌ی Homo و گونه‌ی sapiens."},
{q:"کدام یک قلمرو حیات نیست؟",o:["آرکی","باکتری","یوکاریا","ویروس‌ها"],a:3,e:"ویروس‌ها در سه قلمرو جا نمی‌گیرند."},
{q:"بزرگ‌ترین تهدید برای گونه‌ها چیست؟",o:["تخریب زیستگاه","باران","نور خورشید","ستارگان"],a:0,e:"تخریب و تکه‌تکه‌شدن زیستگاه."}]},

{id:"eco",h:195,name:"بوم‌شناسی",hl:"بوم‌شناسی",tag:"اکولوژی",scale:"۱ متر تا ۱۰۰۰ کیلومتر",
intro:"بوم‌شناسی رابطه‌ی موجودات با یکدیگر و محیط را بررسی می‌کند. از یک جمعیت تا زیست‌کره، انرژی و مواد در جریان‌اند.",
topics:[
["سطوح سازمان","فرد، جمعیت، جامعه، بوم‌سازگان، زیست‌بوم و زیست‌کره. هر سطح ویژگی‌های ویژه‌ی خود را دارد.",["جمعیت","جامعه","زیست‌کره"]],
["جریان انرژی","انرژی از خورشید به تولیدکننده‌ها و سپس مصرف‌کننده‌ها می‌رسد. در هر سطح غذایی حدود ۱۰ درصد انرژی به سطح بعدی می‌رسد، پس هرم انرژی همیشه صعودی کم می‌شود.",["زنجیره‌ی غذایی","هرم انرژی","تجزیه‌کننده"]],
["چرخه‌های مواد","کربن، نیتروژن، فسفر و آب میان جانداران و محیط بازیافت می‌شوند. باکتری‌های تثبیت‌کننده‌ی نیتروژن گاز هوا را به شکل قابل استفاده در می‌آورند.",["چرخه‌ی کربن","تثبیت نیتروژن","تعرق"]],
["پویایی جمعیت","جمعیت‌ها در شرایط مطلوب نمایی رشد می‌کنند، ولی ظرفیت تحمل محیط آن را به منحنی لجستیک می‌رساند. رقابت، شکار و بیماری اندازه‌ی جمعیت را تنظیم می‌کنند.",["ظرفیت تحمل","رشد نمایی","رقابت"]],
["زیست‌بوم‌ها","جنگل بارانی، بیابان، تایگا، علفزار، تندرا، دریا و آب شیرین. هر کدام دما، بارش و موجودات ویژه‌ای دارند.",["تایگا","مرجان","تالاب"]],
["تغییر اقلیم و حفاظت","گازهای گلخانه‌ای دمای زمین را بالا می‌برند و مرجان‌ها، یخچال‌ها و الگوی بارش را تغییر می‌دهند. حفاظت از زیستگاه، انرژی تجدیدپذیر و کشاورزی پایدار راه‌حل‌ها هستند.",["گرمایش جهانی","ردپای کربن","پایداری"]]],
fact:"جنگل‌های بارانی کمتر از هفت درصد خشکی‌ها را می‌پوشانند ولی بیش از نیمی از گونه‌های زمین در آن‌ها زندگی می‌کنند.",
quiz:[
{q:"در هرم انرژی، حدود چه درصدی از انرژی به سطح بعد می‌رسد؟",o:["۱۰۰","۵۰","۱۰","۱"],a:2,e:"قاعده‌ی تقریبی ده درصد."},
{q:"کدام موجود CO₂ را به ماده‌ی آلی تبدیل می‌کند؟",o:["تولیدکننده","شکارچی","انگل","تجزیه‌کننده"],a:0,e:"تولیدکننده‌ها خودپرورند."},
{q:"منحنی رشد لجستیک چه چیزی را نشان می‌دهد؟",o:["رشد بی‌پایان","ظرفیت تحمل محیط","انقراض","جهش"],a:1,e:"جمعیت به ظرفیت تحمل نزدیک می‌شود."}]},

{id:"bio",h:45,name:"زیست‌فناوری و دانش نوین",hl:"نوین",tag:"فناوری",scale:"از ژن تا صنعت",
intro:"زیست‌فناوری از فرایندهای زیستی برای تولید دارو، غذا و انرژی بهره می‌گیرد. بسیاری از آن‌ها بر پایه‌ی ژنتیک مولکولی ساخته شده‌اند.",
topics:[
["مهندسی ژنتیک","با آنزیم‌های برشی و ناقل‌هایی چون پلاسمید، ژن مورد نظر درون یک میزبان وارد می‌شود. انسولین نوترکیب با همین روش در باکتری ساخته می‌شود.",["پلاسمید","آنزیم برشی","DNA نوترکیب"]],
["PCR و توالی‌یابی","PCR قطعه‌ای از DNA را در چند ساعت میلیون‌ها برابر تکثیر می‌کند. توالی‌یابی ترتیب بازها را می‌خواند و پروژه‌ی ژنوم انسان با آن پیش رفت.",["PCR","الکتروفورز","ژنوم"]],
["سلول‌های بنیادی","این سلول‌ها می‌توانند به انواع سلول تبدیل شوند و در درمان بیماری‌های خون و ترمیم بافت کاربرد دارند. پژوهش‌های کنونی بر ساخت بافت و اندام در آزمایشگاه متمرکز است.",["پرتوان","بافت‌سازی","کلونینگ"]],
["بیوانفورماتیک","علم داده و زیست‌شناسی با هم، برای تحلیل ژنوم‌ها، پیش‌بینی ساختار پروتئین و یافتن داروی تازه. هوش مصنوعی در این حوزه جهش بزرگی ایجاد کرده است.",["پایگاه داده","BLAST","ساختار پروتئین"]],
["کشاورزی و صنعت","گیاهان مقاوم به آفت، تخمیر صنعتی، سوخت زیستی و تصفیه‌ی زیستی پساب نمونه‌هایی‌اند. بحث درباره‌ی ایمنی و اخلاق استفاده از آن‌ها همچنان ادامه دارد.",["تراریخته","تخمیر","زیست‌پالایی"]],
["روش علمی و ابزار","مشاهده، فرضیه، آزمایش کنترل‌شده و داوری همتایان پایه‌ی علم‌اند. میکروسکوپ نوری و الکترونی، سانتریفیوژ و رنگ‌آمیزی ابزارهای رایج‌اند.",["فرضیه","گروه شاهد","میکروسکوپ"]]],
fact:"واکسن‌های mRNA از آزمایشگاه تا بازار در کمتر از یک سال طراحی و آزمایش شدند؛ پیش‌تر دهه‌ها تحقیق پایه‌ی آن‌ها را ممکن کرده بود.",
quiz:[
{q:"PCR برای چیست؟",o:["شکافتن پروتئین","تکثیر DNA","ساخت RNA","رنگ‌آمیزی"],a:1,e:"PCR قطعه‌ی هدف را چند برابر می‌کند."},
{q:"پلاسمید در مهندسی ژنتیک نقش چه چیزی را دارد؟",o:["ناقل","میزبان","آنزیم","غذا"],a:0,e:"ژن را به میزبان منتقل می‌کند."},
{q:"گروه شاهد برای چیست؟",o:["مقایسه‌ی نتیجه","تزئین","کاهش هزینه","افزودن متغیر"],a:0,e:"برای جدا کردن اثر متغیر مستقل."}]}
];
var X={
mol:[
{m:"هر مولکول آب یک اتم اکسیژن و دو اتم هیدروژن دارد. اکسیژن الکترون‌ها را بیشتر به سمت خود می‌کشد، پس سر اکسیژن کمی منفی و سر هیدروژن‌ها کمی مثبت می‌شود. همین قطبیت باعث می‌شود مولکول‌های آب با پیوند هیدروژنی به هم بچسبند و نمک‌ها و قندها را در خود حل کنند. آب مایع بودن را در گستره‌ی دمایی مناسب حفظ می‌کند و یخ از آب مایع سبک‌تر است، پس دریاچه‌ها از سطح یخ می‌زنند و موجودات زیر یخ زنده می‌مانند.",k:["قطبی بودن مولکول آب، توان حلالیت را می‌سازد","چسبندگی و پیوستگی آب، صعود شیره‌ی خام در گیاهان را ممکن می‌کند","گرمای ویژه‌ی بالا مانع نوسان شدید دمای بدن می‌شود"],x:"عرق کردن بدن را خنک می‌کند، چون تبخیر آب مقدار زیادی گرما از پوست می‌برد."},
{m:"کربوهیدرات‌ها از کربن، هیدروژن و اکسیژن ساخته شده‌اند. تک‌قندی‌ها مانند گلوکز و فروکتوز کوچک‌ترین واحدند و دو تک‌قندی با پیوند گلیکوزیدی یک دوقندی می‌سازند. چندقندی‌ها زنجیره‌های بلندی از گلوکزند اما شکل اتصال آن‌ها کارکردشان را عوض می‌کند: نشاسته و گلیکوژن ذخیره‌ی انرژی‌اند ولی سلولز فقط ساختاری است و بیشتر جانوران نمی‌توانند آن را هضم کنند.",k:["گلوکز سوخت اصلی سلول‌هاست","گیاهان نشاسته و جانوران گلیکوژن ذخیره می‌کنند","سلولز فراوان‌ترین ترکیب آلی روی زمین است"],x:"نان و برنج نشاسته دارند؛ آنزیم آمیلاز در دهان آن‌ها را کم‌کم شیرین می‌کند."},
{m:"لیپیدها گروهی ناهمگن‌اند که اغلب در آب حل نمی‌شوند. هر تری‌گلیسرید از یک گلیسرول و سه اسید چرب ساخته شده و بیش از دو برابر قند انرژی در هر گرم ذخیره می‌کند. فسفولیپید یک سر آب‌دوست و دو دم آب‌گریز دارد؛ در آب خودبه‌خود دولایه می‌شود و پایه‌ی هر غشای سلولی است. استروئیدها حلقه‌های متصل دارند و کلسترول، هورمون‌های جنسی و ویتامین D از این گروه‌اند.",k:["فسفولیپیدها دولایه‌ی غشا را می‌سازند","چربی‌ها عایق گرما و ذخیره‌ی انرژی‌اند","کلسترول سیالیت غشا را تنظیم می‌کند"],x:"چربی زیرپوست خرس قطبی هم انبار انرژی است و هم عایق در برابر سرمای شدید."},
{m:"تنوع پروتئین‌ها از ترتیب آمینواسیدها می‌آید. ساختار اول همان توالی است، ساختار دوم مارپیچ آلفا و صفحه‌ی بتا، ساختار سوم تاخوردگی کامل زنجیره و ساختار چهارم کنار هم قرار گرفتن چند زنجیره است. تغییر یک آمینواسید گاهی کل شکل را عوض می‌کند، مانند بیماری کم‌خونی داسی‌شکل. گرما یا pH شدید پروتئین را واسرشت می‌کند، همان اتفاقی که هنگام پختن تخم‌مرغ می‌افتد.",k:["ساختار سه‌بعدی کار پروتئین را مشخص می‌کند","هموگلوبین چهار زنجیره دارد و اکسیژن می‌برد","واسرشت‌شدن یعنی از دست رفتن شکل و کارکرد"],x:"سفیده‌ی تخم‌مرغ با پخته شدن سفید می‌شود، چون پروتئین‌ها واسرشت شده و به هم چسبیده‌اند."},
{m:"هر نوکلئوتید از یک قند، یک فسفات و یک باز آلی ساخته می‌شود. در DNA قند دئوکسی‌ریبوز و بازها A، T، G و C هستند؛ در RNA قند ریبوز و به جای T باز U وجود دارد. DNA دو رشته‌ای و پایدار است و برای حفظ اطلاعات مناسب است، RNA معمولاً تک‌رشته‌ای است و نقش پیام‌رسان و کارگر دارد. مولکول ATP از آدنین، ریبوز و سه فسفات تشکیل شده و جدا شدن فسفات آخر انرژی آزاد می‌کند.",k:["در DNA، A با T و G با C جفت می‌شود","انواع RNA: پیک، ناقل و ریبوزومی","ATP پول انرژی همه‌ی سلول‌هاست"],x:"هر سلول عضله در ثانیه میلیون‌ها ATP مصرف می‌کند و آن را دوباره می‌سازد."},
{m:"آنزیم‌ها معمولاً پروتئین‌اند و هر کدام فقط یک یا چند پیش‌ماده‌ی مشخص را می‌شناسند. پیش‌ماده در جایگاه فعال می‌نشیند، پیچ و تاب مختصری در آنزیم رخ می‌دهد و واکنش با انرژی کمتر پیش می‌رود. در دمای بالا آنزیم واسرشت می‌شود و در pH نامناسب کارایی‌اش کم می‌شود؛ آنزیم معده در اسید فعال است ولی آنزیم روده‌ی باریک در محیط قلیایی. بازدارنده‌ها می‌توانند جایگاه فعال را ببندند یا شکل آنزیم را عوض کنند.",k:["هر آنزیم برای یک پیش‌ماده‌ی ویژه است","دما و pH بهینه دارد","مصرف نمی‌شود و بارها به کار می‌رود"],x:"لاکتاز شکر شیر را می‌شکند؛ کسانی که آن را کم دارند با نوشیدن شیر دچار ناراحتی می‌شوند."}],

cell:[
{m:"در سلول پیش‌هسته‌ای DNA آزادانه در سیتوپلاسم قرار دارد و اندامک غشادار ندارد، اما ریبوزوم دارد. این سلول‌ها معمولاً از ۱ تا ۱۰ میکرومتر هستند. سلول‌های هسته‌دار بزرگ‌ترند (۱۰ تا ۱۰۰ میکرومتر) و بخش‌های داخلی خود را با غشا از هم جدا می‌کنند؛ این کار امکان انجام هم‌زمان واکنش‌های متضاد را فراهم می‌کند. نظریه‌ی درون‌همزیستی می‌گوید میتوکندری و کلروپلاست روزگاری باکتری‌های مستقلی بودند که به درون یک سلول بزرگ‌تر رفتند.",k:["باکتری‌ها هسته ندارند ولی DNA دارند","یوکاریوت‌ها اندامک غشادار دارند","میتوکندری و کلروپلاست DNA و ریبوزوم مخصوص خود دارند"],x:"باکتری اشرشیاکلی هر ۲۰ دقیقه یک بار تقسیم می‌شود، پس در یک روز نسل‌های بسیاری می‌سازد."},
{m:"سیتوپلاسم شامل ماده‌ی نیمه‌شفاف درون سلول و اندامک‌هاست. هسته با منفذهای هسته‌ای ژن‌ها را حفاظت می‌کند و هستک ریبوزوم می‌سازد. شبکه‌ی آندوپلاسمی زبر ریبوزوم دارد و پروتئین می‌سازد، نوع صاف لیپید می‌سازد. گلژی پروتئین‌ها را بسته‌بندی و برچسب‌گذاری می‌کند. واکوئل در گیاهان آب ذخیره می‌کند و فشار تورژسانس را برای استواری سلول به‌وجود می‌آورد.",k:["هسته‌ی سلول مرکز کنترل است","میتوکندری نیروگاه سلول است","لیزوزوم‌ها مواد زائد و ذرات را هضم می‌کنند"],x:"سلول‌های ترشح‌کننده‌ی آنزیم‌های گوارشی، شبکه‌ی آندوپلاسمی و گلژی بسیار گسترده‌ای دارند."},
{m:"دولایه‌ی فسفولیپیدی غشا به علت دم‌های آب‌گریز، به راحتی مولکول‌های قطبی و یون‌ها را عبور نمی‌دهد. پروتئین‌های غشایی نقش‌های گوناگونی دارند: کانال، ناقل، گیرنده، آنزیم و برچسب هویتی. در سطح بیرونی، کربوهیدرات‌ها به لیپید و پروتئین متصل می‌شوند و سلول‌ها یکدیگر را از این نشانه‌ها می‌شناسند. دیواره‌ی سلولی در گیاهان، قارچ‌ها و باکتری‌ها بیرون غشا قرار دارد و به شکل سلول استحکام می‌دهد.",k:["غشا نفوذپذیری انتخابی دارد","پروتئین‌ها نقش ناقل و گیرنده دارند","کلسترول سیالیت غشا را تنظیم می‌کند"],x:"گروه‌های خونی A و B و O به دلیل قندهای متفاوت روی غشای گلبول‌های قرمز است."},
{m:"در انتشار ساده مولکول‌ها از غلظت زیاد به کم می‌روند و در انتشار تسهیل‌شده این کار با کمک پروتئین‌های کانالی انجام می‌شود. اسمز حرکت آب از محلول رقیق‌تر به غلیظ‌تر است. در انتقال فعال، پمپ سدیم-پتاسیم در هر بار کار سه یون سدیم را بیرون و دو یون پتاسیم را داخل می‌برد و ATP مصرف می‌کند. این پمپ بخش بزرگی از انرژی سلول‌های عصبی را می‌گیرد و پتانسیل غشا را پایدار نگه می‌دارد.",k:["انتشار بدون مصرف انرژی است","انتقال فعال به ATP نیاز دارد","اندوسیتوز ذرات بزرگ را وارد می‌کند"],x:"اگر گلبول قرمز را در آب مقطر بگذارید به‌خاطر اسمز آب جذب می‌کند و می‌ترکد."},
{m:"تنفس سلولی چهار مرحله دارد: گلیکولیز در سیتوپلاسم گلوکز را به پیرووات می‌شکند، سپس پیرووات به میتوکندری می‌رود، چرخه‌ی کربس الکترون‌دهنده‌هایی مانند NADH می‌سازد و در زنجیره‌ی انتقال الکترون، اکسیژن پذیرنده‌ی نهایی است و ATP سنتاز بیشترین ATP را می‌سازد. در نبود اکسیژن، تخمیر انجام می‌شود که انرژی بسیار کمتری می‌دهد. در فتوسنتز نیز واکنش‌های نوری در تیلاکوئید و چرخه‌ی کالوین در بستره رخ می‌دهد.",k:["گلیکولیز بی‌هوازی و در سیتوپلاسم است","بیشتر ATP در غشای درونی میتوکندری ساخته می‌شود","تخمیر لاکتیکی در عضله هنگام ورزش شدید رخ می‌دهد"],x:"خمیر نان بر اثر تخمیر مخمر پف می‌کند، چون CO₂ تولید می‌شود."},
{m:"چرخه‌ی سلولی از مراحل G1، S، G2 و M ساخته شده است. در S همانندسازی DNA رخ می‌دهد و در M هسته و سپس سیتوپلاسم تقسیم می‌شود. میتوز در چهار مرحله‌ی پروفاز، متافاز، آنافاز و تلوفاز انجام می‌شود. در میوز، کروموزوم‌های همتا قطعاتی را عوض می‌کنند و ترکیب‌های ژنتیکی تازه پدید می‌آید. سرطان وقتی رخ می‌دهد که ژن‌های کنترل‌کننده‌ی چرخه جهش یابند و سلول بی‌وقفه تقسیم شود.",k:["میتوز سلول‌های همانند می‌سازد","میوز گامت می‌سازد","جهش در ژن‌های کنترلی خطر سرطان را زیاد می‌کند"],x:"زخم پوست در چند روز ترمیم می‌شود، چون سلول‌های اطراف با میتوز جایگزین می‌شوند."}],

gen:[
{m:"ساختار مارپیچ دوگانه را واتسون و کریک در سال ۱۹۵۳ با کمک تصاویر پراش پرتو ایکس روزالیند فرانکلین پیشنهاد کردند. ستون هر رشته از قند و فسفات است و بازها به سمت داخل‌اند. دو رشته پادموازی‌اند، یعنی جهت آن‌ها خلاف هم است. در هسته، DNA دور پروتئین‌های هیستون می‌پیچد و نوکلئوزوم می‌سازد و سپس کروماتین فشرده‌تر می‌شود تا در کروموزوم‌ها جا شود.",k:["A با T دو پیوند و G با C سه پیوند هیدروژنی می‌سازد","هیستون‌ها DNA را بسته‌بندی می‌کنند","ژن بخشی از DNA است که یک محصول را رمز می‌کند"],x:"انسان ۲۳ جفت کروموزوم دارد، ولی ذرت ۱۰ جفت و سگ ۳۹ جفت."},
{m:"همانندسازی از نقطه‌ی آغاز شروع می‌شود، هلیکاز دو رشته را از هم باز می‌کند و پرایماز آغازگر کوتاهی می‌سازد. DNA پلیمراز فقط می‌تواند نوکلئوتید را به انتهای ۳' اضافه کند، بنابراین رشته‌ی پیشرو پیوسته و رشته‌ی پیرو قطعه‌قطعه (قطعات اکازاکی) ساخته می‌شود و لیگاز آن‌ها را به هم می‌دوزد. DNA پلیمراز توان تصحیح دارد و اشتباهات را برمی‌دارد، پس دقت زیاد است.",k:["همانندسازی نیمه‌حفاظتی است","رشته‌ی پیرو قطعه‌قطعه ساخته می‌شود","لیگاز قطعات را به هم می‌پیوندد"],x:"مولکول‌های DNA هر سلول انسان پیش از تقسیم در چند ساعت از نو نسخه‌برداری می‌شوند."},
{m:"در رونویسی، RNA پلیمراز به راه‌انداز (پیشبر) ژن می‌چسبد و رشته‌ی mRNA می‌سازد. در یوکاریوت‌ها بخش‌های درون‌ژنی (اینترون) بریده و بخش‌های برون‌ژنی (اگزون) به هم متصل می‌شوند. در ترجمه، tRNA با پادرمزه‌ی خود به رمزه‌ی mRNA می‌چسبد و آمینواسید مناسب را می‌آورد. ریبوزوم آمینواسیدها را با پیوند پپتیدی وصل می‌کند تا به رمزه‌ی پایان برسد. رمز ژنتیک برای همه‌ی موجودات تقریباً یکسان است.",k:["رونویسی در هسته و ترجمه در ریبوزوم انجام می‌شود","هر رمزه سه نوکلئوتید است","AUG رمزه‌ی آغاز است"],x:"ژن انسولین انسان را می‌توان به باکتری داد و باکتری انسولین انسانی می‌سازد."},
{m:"مندل صفت‌هایی مانند رنگ گل و شکل بذر را روی هزاران گیاه نخود بررسی کرد. نسل اول دورگ‌ها همه شبیه یک والد (غالب) بودند و در نسل دوم نسبت ۳ به ۱ ظاهر شد. او نتیجه گرفت که هر فرد دو عامل وراثتی دارد که هنگام تشکیل گامت‌ها جدا می‌شوند. در تلاقی دو صفت هم‌زمان، نسبت ۹:۳:۳:۱ به دست می‌آید که نشان می‌دهد صفات می‌توانند مستقل از هم به ارث برسند.",k:["ژنوتیپ مجموعه‌ی اَلل‌های فرد است و فنوتیپ ظاهر آن","هموزیگوت دو اَلل یکسان و هتروزیگوت دو اَلل متفاوت دارد","مربع پانت احتمال‌ها را نشان می‌دهد"],x:"اگر هر دو والد ناقل بیماری نهفته‌ای باشند، هر فرزند با احتمال ۲۵٪ مبتلا می‌شود."},
{m:"در بارزی ناقل (هم‌توانی) هر دو اَلل بروز می‌کنند، مانند گروه خونی AB. در بارزی ناقص، هتروزیگوت حد واسط دو والد است؛ گل میمونی قرمز با سفید گل صورتی می‌دهد. ژن‌های روی یک کروموزوم معمولاً با هم به ارث می‌رسند و تنها کراسینگ‌اور آن‌ها را جدا می‌کند. صفات وابسته به X مانند کوررنگی و هموفیلی در مردان شایع‌ترند چون فقط یک X دارند.",k:["چندآللی یعنی بیش از دو اَلل در جمعیت","ژن‌های وابسته به X در مردان با یک اَلل نهفته هم بروز می‌کنند","محیط نیز بر بیان بسیاری از صفات اثر دارد"],x:"رنگ پوست انسان تحت تأثیر چند ژن است و به یک ژن محدود نیست."},
{m:"جهش‌ها می‌توانند جانشینی یک باز، حذف یا اضافه‌شدن باز یا تغییرات کروموزومی باشند. جهش‌های جابه‌جایی چارچوب خواندن (حذف یا اضافه) معمولاً پروتئین را کاملاً عوض می‌کنند. عوامل جهش‌زا مانند پرتو فرابنفش و برخی مواد شیمیایی خطا را زیاد می‌کنند. اپی‌ژنتیک بررسی تغییراتی است که بدون تغییر توالی DNA بیان ژن را عوض می‌کند. CRISPR با یک RNA راهنما، آنزیم Cas9 را به محل ژن می‌رساند و آن را می‌برد.",k:["جهش ماده‌ی خام تکامل است","اپی‌ژنتیک بدون تغییر توالی بر بیان ژن اثر می‌گذارد","ویرایش ژن چالش‌های اخلاقی دارد"],x:"در جهش‌های کم‌خونی داسی‌شکل، تغییر یک باز یک آمینواسید هموگلوبین را عوض می‌کند."}],

mic:[
{m:"باکتری‌ها دیواره‌ای از پپتیدوگلیکان دارند و در رنگ‌آمیزی گرم به دو گروه مثبت و منفی تقسیم می‌شوند. بسیاری مژک یا تاژک برای حرکت دارند و برخی هنگام شرایط سخت درون‌هاگ می‌سازند. باکتری‌ها می‌توانند با پیوند (کونژوگاسیون) پلاسمید رد و بدل کنند، و همین راهی برای گسترش مقاومت دارویی است. همچنین باکتری‌های سیانو فتوسنتز می‌کنند و بخش بزرگی از اکسیژن اولیه‌ی زمین را ساختند.",k:["تقسیم دوتایی سریع است","پلاسمید ژن‌های مقاومت را جابه‌جا می‌کند","بیشتر باکتری‌ها بی‌ضرر یا مفیدند"],x:"ماست و پنیر محصول فعالیت باکتری‌های لاکتیکی‌اند."},
{m:"ویروس کپسید پروتئینی و ژنوم DNA یا RNA دارد و برخی غشای چربی هم دارند. چرخه‌ی آن شامل اتصال، ورود، همانندسازی، مونتاژ و خروج است. باکتریوفاژها باکتری‌ها را آلوده می‌کنند. رتروویروس‌ها مانند HIV با آنزیم نسخه‌بردار معکوس از RNA، DNA می‌سازند و در ژنوم میزبان جا می‌دهند. جهش سریع ویروس‌ها دلیل نیاز به واکسن آنفلوآنزای سالانه است.",k:["ویروس‌ها سلول ندارند","هر ویروس میزبان ویژه‌ای دارد","آنتی‌بیوتیک بر آن‌ها بی‌اثر است"],x:"باکتریوفاژها را برای درمان عفونت‌های مقاوم به آنتی‌بیوتیک هم آزموده‌اند."},
{m:"قارچ‌ها دیواره‌ای از کیتین دارند و با هیف‌ها شبکه‌ی ریسه‌ی (میسلیوم) می‌سازند. آن‌ها تجزیه‌کننده‌های اصلی طبیعت‌اند و برخی با ریشه‌ی گیاهان همزیستی (میکوریز) می‌کنند. پنی‌سیلین از قارچ پنی‌سیلیوم به دست آمد. آغازیان گروه گسترده‌ای از یوکاریوت‌هایی هستند که گیاه، جانور یا قارچ نیستند: جلبک‌های تک‌سلولی، آمیب و پارامسی نمونه‌اند.",k:["قارچ‌ها هتروتروف‌اند","میکوریز جذب آب و املاح گیاه را زیاد می‌کند","پلاسمودیوم با پشه‌ی آنوفل منتقل می‌شود"],x:"پنی‌سیلین را الکساندر فلمینگ در سال ۱۹۲۸ تصادفی کشف کرد."},
{m:"پوست و مخاط مانع فیزیکی‌اند و اشک و بزاق لیزوزیم دارند که دیواره‌ی باکتری را می‌شکند. اگر میکروب عبور کند، ماکروفاژها و نوتروفیل‌ها آن را می‌بلعند (بیگانه‌خواری) و سلول‌های آسیب‌دیده هیستامین ترشح می‌کنند که رگ‌ها را گشاد می‌کند؛ نتیجه‌ی آن قرمزی، گرما و تورم محل التهاب است. مولکول‌های اینترفرون سلول‌های اطراف را در برابر ویروس آماده می‌کنند.",k:["ایمنی ذاتی اختصاصی نیست و سریع است","تب فعالیت دفاعی را بالا می‌برد","التهاب علامت پاسخ دفاعی است"],x:"چرک، مجموعه‌ی گلبول‌های سفید مرده و میکروب‌هاست."},
{m:"آنتی‌ژن مولکولی است که پادتن به آن می‌چسبد. پادتن‌ها پروتئین‌های Y شکل با جایگاه‌های اتصال اختصاصی‌اند و می‌توانند میکروب را بی‌اثر کنند یا نشانه‌گذاری کنند. لنفوسیت T کمک‌کننده پاسخ‌ها را هماهنگ می‌کند و T کشنده سلول‌های آلوده را از بین می‌برد. بار نخست پاسخ آهسته است ولی در تماس بعدی سلول‌های حافظه پاسخ را سریع و قوی می‌کنند. بیماری‌های خودایمنی وقتی رخ می‌دهد که بدن به سلول‌های خود حمله کند.",k:["پادتن اختصاصی است","حافظه‌ی ایمنی پایه‌ی واکسن است","آلرژی پاسخ شدید به آنتی‌ژن بی‌خطر است"],x:"سرخک پس از یک بار ابتلا معمولاً ایمنی همیشگی می‌دهد."},
{m:"واکسن عامل ضعیف‌شده، کشته‌شده، یا قطعه‌ای از آن را وارد می‌کند تا بدن حافظه بسازد. در واکسن mRNA، دستور ساخت یک پروتئین ویروسی به سلول می‌رسد. وقتی بیشتر افراد جامعه ایمن باشند، گسترش بیماری برای کسانی که واکسن نزده‌اند هم دشوار می‌شود (ایمنی جمعی). مصرف بی‌مورد آنتی‌بیوتیک باکتری‌های مقاوم را برمی‌گزیند و درمان آینده را دشوار می‌کند.",k:["دوره‌ی آنتی‌بیوتیک را تا آخر باید کامل کرد","واکسن پیش از بیماری آموزش می‌دهد","ایمنی جمعی از افراد آسیب‌پذیر محافظت می‌کند"],x:"آبله با واکسیناسیون جهانی در سال ۱۹۸۰ ریشه‌کن اعلام شد."}],

plant:[
{m:"ریشه با تارهای کشنده سطح جذب را بسیار زیاد می‌کند. در ساقه هر دو آوند چوبی و آبکش وجود دارد و در دولپه‌ای‌ها دسته‌های آوندی در یک حلقه‌اند. برگ از روپوست، میانبرگ و آوندها تشکیل شده و روزنه‌ها با سلول‌های نگهبان باز و بسته می‌شوند تا تبادل گاز و تعرق تنظیم شود. تعرق، آب را از ریشه تا برگ می‌کشد.",k:["چوب آب و املاح را بالا می‌برد","آبکش قندها را پخش می‌کند","روزنه‌ها تبادل گاز و تعرق را کنترل می‌کنند"],x:"حلقه‌های سالانه‌ی درخت حاصل فعالیت کامبیوم در فصل‌های مختلف است."},
{m:"واکنش‌های نوری در غشای تیلاکوئید با جذب نور توسط کلروفیل انجام می‌شود، آب شکسته و O₂ آزاد می‌شود و ATP و NADPH ساخته می‌شود. در چرخه‌ی کالوین (بستره)، آنزیم روبیسکو CO₂ را تثبیت می‌کند و با مصرف ATP و NADPH قند سه‌کربنه می‌سازد. شدت نور، غلظت CO₂ و دما بر سرعت فتوسنتز اثر می‌گذارند. گیاهان C4 مانند ذرت در هوای گرم کارایی بیشتری دارند.",k:["واکنش‌های نوری در تیلاکوئید رخ می‌دهد","چرخه‌ی کالوین در بستره است","روبیسکو فراوان‌ترین آنزیم زمین است"],x:"جلبک‌ها و باکتری‌های دریایی نزدیک نیمی از اکسیژن زمین را تولید می‌کنند."},
{m:"خزه‌ها آوند ندارند و باید در مکان‌های مرطوب باشند و تولیدمثل آن‌ها به آب نیاز دارد. سرخس‌ها آوند دارند اما دانه ندارند و با هاگ زاده می‌شوند. بازدانگان مانند کاج دانه‌ی بدون پوشش و مخروط دارند. نهان‌دانگان گل و میوه دارند و دانه در درون تخمدان محافظت می‌شود. این ویژگی به آن‌ها سازگاری گسترده داد.",k:["چرخه‌ی زندگی گیاهان تناوب نسل دارد","دانه موجب گسترش در خشکی شد","نهان‌دانگان به تک‌لپه‌ای و دولپه‌ای تقسیم می‌شوند"],x:"گندم و برنج از تک‌لپه‌ای‌ها و لوبیا و نخود از دولپه‌ای‌ها هستند."},
{m:"گل شامل کاسبرگ، گلبرگ، پرچم (اندام نر) و مادگی (اندام ماده) است. دانه‌ی گرده بر کلاله می‌نشیند و لوله‌ی گرده به سمت تخمک رشد می‌کند. یکی از دو سلول اسپرم با تخمزا لقاح می‌دهد و زیگوت می‌سازد و دیگری با دو هسته‌ی دیگر درون‌دانه را می‌سازد. دانه جنین و ذخیره‌ی غذا دارد و میوه به پراکنش آن کمک می‌کند.",k:["گرده‌افشانی با حشره، باد یا پرنده انجام می‌شود","لقاح مضاعف ویژه‌ی نهان‌دانگان است","میوه از تخمدان ساخته می‌شود"],x:"رنگ و بوی گل‌ها جاذب زنبورها هستند و گلبرگ‌های پهن برای فرود آنها طراحی شده است."},
{m:"اکسین در نوک ساقه ساخته می‌شود و در سمت تاریک تجمع می‌یابد، پس آن سمت بیشتر رشد می‌کند و ساقه به سمت نور خم می‌شود. جیبرلین طویل‌شدن ساقه و جوانه‌زنی دانه را تحریک می‌کند. سیتوکینین با اکسین در تقسیم سلولی همکاری می‌کند. آبسزیک‌اسید هنگام کم‌آبی روزنه‌ها را می‌بندد. اتیلن گازی است که میوه‌ها را می‌رساند و برگ‌ها را می‌ریزد.",k:["اکسین ساقه را به سمت نور می‌برد","آبسزیک‌اسید هورمون تنش است","هورمون‌ها در مقدار کم کار می‌کنند"],x:"یک موز رسیده کنار سیب سبز آن را سریع‌تر می‌رساند چون اتیلن آزاد می‌کند."},
{m:"کاکتوس‌ها برگ را به خار تبدیل کرده و ساقه‌ی ضخیم آبدار دارند. گیاهان CAM مانند کاکتوس شب CO₂ را جذب می‌کنند تا روز تعرق کم شود. گیاهان آبزی بافت هواسازی دارند. گیاهان گوشتخوار در خاک فقیر از نیتروژن، با به دام انداختن حشره نیتروژن می‌گیرند. بعضی گیاهان با باکتری‌های ریزوبیوم همزیستی می‌کنند و نیتروژن هوا را تثبیت می‌کنند، مانند گیاهان خانواده‌ی نخود.",k:["سازگاری حاصل انتخاب طبیعی است","گیاهان تیره‌ی نخود خاک را حاصلخیز می‌کنند","همزیستی ریشه سود دوطرفه دارد"],x:"سس گیاه انگلی است و بدون کلروفیل، از میزبان مواد می‌گیرد."}],

anim:[
{m:"بی‌مهرگان بیشتر گونه‌های جانوری هستند. اسفنج‌ها بافت واقعی ندارند، مرجانیان تقارن شعاعی و گوارش ساده دارند، پلاناریا نخستین جانوران با تقارن دوطرفه‌اند و کرم‌های حلقوی مانند کرم خاکی بدنی بندبند دارند. نرم‌تنان شامل حلزون، صدف و هشت‌پایند و بندپایان اسکلت بیرونی و اندام‌های مفصل‌دار دارند. خارپوستان مانند ستاره‌ی دریایی تقارن شعاعی در بزرگسالی دارند.",k:["بندپایان بزرگ‌ترین شاخه‌اند","اسکلت بیرونی نیاز به پوست‌اندازی دارد","نرم‌تنان بدن نرم و اغلب صدف دارند"],x:"هشت‌پا سه قلب و خون آبی‌رنگ دارد و از باهوش‌ترین بی‌مهرگان است."},
{m:"در مهره‌داران، ستون مهره از نخاع محافظت می‌کند. ماهی‌ها آبشش و قلب دو‌حفره‌ای دارند. دوزیستان در مرحله‌ی لارو آبششی و در بزرگسالی ریوی‌اند. خزندگان پوست خشک و تخم دارای پوسته دارند. پرندگان پر دارند و استخوان‌هایشان سبک است، پستانداران مو دارند و فرزندان خود را با شیر تغذیه می‌کنند. قلب پرندگان و پستانداران چهارحفره‌ای است.",k:["دوزیستان پوست مرطوب دارند","پرندگان و پستانداران خون‌گرم‌اند","پستانداران غدد شیری دارند"],x:"خفاش تنها پستاندار پروازکننده است."},
{m:"در لقاح خارجی، گامت‌ها در آب آزاد می‌شوند و در لقاح داخلی درون بدن ماده می‌آمیزند. تخم‌گذاران جنین را درون تخم می‌پرورانند و زنده‌زایان درون رحم. جنین در گاسترولا سه لایه‌ی خارجی، میانی و داخلی می‌سازد که به ترتیب پوست و عصب، ماهیچه و استخوان، و لوله‌ی گوارش را به وجود می‌آورند. در دگردیسی مانند قورباغه، بدن لارو به شکل بالغ تغییر می‌کند.",k:["گاسترولا اساس سه لایه‌ی جنینی است","دگردیسی در حشرات و دوزیستان رخ می‌دهد","مراقبت از فرزند در پستانداران بیشتر است"],x:"پروانه چهار مرحله دارد: تخم، لارو، شفیره و بالغ."},
{m:"شتر چربی را در کوهان ذخیره می‌کند و ادرار غلیظ دارد. خفاش و دلفین با فرستادن صوت و دریافت پژواک، محیط را «می‌بینند». قورباغه‌های سمی با رنگ‌های درخشان خطرشان را اعلام می‌کنند و آفتاب‌پرست رنگ خود را تغییر می‌دهد. خرس‌ها و جوندگان زمستان‌خواب سوخت‌وساز را کم و انرژی ذخیره‌شده را مصرف می‌کنند. این‌ها همگی نتیجه‌ی ده‌ها میلیون سال انتخاب طبیعی‌اند.",k:["استتار در برابر شکارچی محافظت می‌کند","هشداردهنده‌ها رنگ‌های تند دارند","سازگاری یعنی ویژگی سودمند در محیط"],x:"ماهی‌های قطبی پروتئین ضدیخ در خون دارند."},
{m:"سامانه‌ی عصبی جانوران ساده شبکه‌ای پراکنده است. جانوران پیچیده‌تر دارای طناب عصبی و گانگلیون‌اند. مغز در مهره‌داران به بخش‌هایی مانند مخ، مخچه و ساقه‌ی مغز تقسیم می‌شود. اندام‌های حسی اطلاعات را به شکل پیام عصبی به مغز می‌فرستند؛ چشم ساده تا چشم مرکب حشرات و چشم عدسی‌دار مهره‌داران. اندازه‌ی نسبی مغز به توانایی یادگیری بستگی دارد.",k:["نورون‌ها واحد پیام‌رسان‌اند","حواس اطلاعات را جمع‌آوری می‌کنند","مخ مرکز تفکر و حافظه است"],x:"زنبور عسل رنگ‌های فرابنفش را می‌بیند که چشم انسان نمی‌بیند."},
{m:"همزیستی دو گونه‌ی متفاوت در تماس دائمی است. در مفیدزیستی هر دو سود می‌برند، مانند باکتری‌های روده‌ی گاو که سلولز را هضم می‌کنند. در همسفرگی یکی سود می‌برد و دیگری بی‌تفاوت است. در انگلی یکی سود و دیگری زیان می‌بیند، مانند کک و کنه. شکارگری و رقابت هم روابط مهم‌اند و تعادل جمعیت‌ها را تنظیم می‌کنند.",k:["مفیدزیستی دوطرفه است","انگل معمولاً میزبان را نمی‌کشد","رقابت برای منابع محدود رخ می‌دهد"],x:"ماهی دلقک و شقایق دریایی با هم زندگی می‌کنند و از هم محافظت می‌کنند."}],

human:[
{m:"قلب با دریچه‌هایی که خون را یک‌طرفه نگه می‌دارند، خون را پمپ می‌کند. خون کم‌اکسیژن از دهلیز راست به بطن راست و سپس ریه‌ها می‌رود، خون اکسیژن‌دار به دهلیز و بطن چپ می‌آید و از سرخرگ آئورت به بدن پمپ می‌شود. خون از پلاسما، گلبول‌های قرمز، گلبول‌های سفید و پلاکت تشکیل می‌شود. پلاکت‌ها در لخته‌شدن خون نقش دارند. فشار خون بالا قلب و رگ‌ها را آسیب می‌زند.",k:["گردش ریوی خون را به ریه می‌برد","هموگلوبین اکسیژن حمل می‌کند","پلاکت‌ها لخته می‌سازند"],x:"یک قطره خون میلیون‌ها گلبول قرمز دارد."},
{m:"هوا از بینی وارد می‌شود و گرم و مرطوب و فیلتر می‌شود. در دم، دیافراگم پایین می‌رود و قفسه بزرگ می‌شود و فشار ریه کم می‌شود، پس هوا وارد می‌شود. در آلوئول‌ها، O₂ به خون و CO₂ از خون به هوا می‌رود. بیشتر CO₂ به صورت بی‌کربنات در خون حمل می‌شود. سیگار مژک‌های مجاری را فلج می‌کند و خطر سرطان را بالا می‌برد.",k:["سطح آلوئول‌ها حدود یک زمین تنیس است","مراکز تنفس در ساقه‌ی مغز هستند","CO₂ زیاد تنفس را تحریک می‌کند"],x:"ورزش شدید ریتم تنفس را بالا می‌برد چون CO₂ خون زیاد می‌شود."},
{m:"گوارش مکانیکی و شیمیایی از دهان شروع می‌شود: آمیلاز بزاق نشاسته را می‌شکند. در معده، اسید کلریدریک و پپسین پروتئین‌ها را تجزیه می‌کنند. صفرا چربی‌ها را ریز می‌کند، لوزالمعده آنزیم‌های قوی می‌ریزد و بیشتر جذب در روده‌ی باریک رخ می‌دهد که پرزهای فراوان دارد. روده‌ی بزرگ آب و املاح را جذب و مدفوع را شکل می‌دهد.",k:["صفرا از کبد است و در کیسه‌ی صفرا ذخیره می‌شود","پرزها سطح جذب را زیاد می‌کنند","میکروبیوم به گوارش کمک می‌کند"],x:"طول روده‌ی باریک چند متر است و غذا حدود چند ساعت در آن می‌ماند."},
{m:"نورون از جسم سلولی، دندریت و آکسون ساخته شده است. در حالت استراحت داخل نورون نسبت به بیرون منفی است. وقتی تحریک به آستانه برسد کانال‌های سدیمی باز می‌شوند و پتانسیل عمل پدید می‌آید که در طول آکسون پیش می‌رود. در سیناپس ناقل‌های عصبی مانند دوپامین و استیل‌کولین آزاد می‌شوند. دستگاه عصبی خودمختار شامل هم‌حس و پادهم‌حس است.",k:["پتانسیل عمل همه یا هیچ است","میلین سرعت پیام را بالا می‌برد","بازتاب پاسخ سریع بدون دخالت مغز است"],x:"عکس‌العمل کشیدن دست از شیء داغ، بازتابی نخاعی و پیش از آگاهی است."},
{m:"غدد درون‌ریز هورمون را به خون می‌ریزند. هیپوفیز که «غده‌ی فرمانده» است هورمون‌هایی ترشح می‌کند که غدد دیگر را تنظیم می‌کنند. تیروئید سرعت سوخت‌وساز را تنظیم می‌کند و کمبود ید باعث گواتر می‌شود. پانکراس انسولین و گلوکاگون می‌سازد، و در دیابت این تعادل از بین می‌رود. تنظیم بیشتر هورمون‌ها با بازخورد منفی است.",k:["هورمون‌ها اثر دیرتر و ماندگارتر از اعصاب دارند","دیابت یعنی اختلال در قند خون","آدرنالین بدن را برای واکنش آماده می‌کند"],x:"در هنگام ترس، آدرنالین ضربان قلب را بالا می‌برد."},
{m:"خون در گلومرول کلیه صاف می‌شود و مواد کوچک وارد کپسول بومن می‌شوند. سپس در لوله‌های پیچ‌خورده، گلوکز و بیشتر آب بازجذب می‌شود و مواد زائد مانند اوره به ادرار می‌پیوندند. هورمون ضدادراری (ADH) میزان بازجذب آب را تنظیم می‌کند. کلیه همچنین فشار خون و pH را کنترل می‌کند. اگر کلیه‌ها از کار بیفتند، دیالیز یا پیوند لازم است.",k:["هر نفرون یک گلومرول دارد","اوره از تجزیه‌ی پروتئین است","ADH آب را حفظ می‌کند"],x:"نوشیدن آب کم، ادرار را غلیظ و تیره می‌کند."},
{m:"استخوان بافت زنده است که پیوسته بازسازی می‌شود و کلسیم و فسفر ذخیره می‌کند. استخوان‌ها در مفصل‌ها با رباط به هم و ماهیچه‌ها با زردپی به استخوان می‌چسبند. ماهیچه‌ی اسکلتی ارادی، ماهیچه‌ی صاف غیرارادی و ماهیچه‌ی قلبی منحصر به فرد است. انقباض در سارکومر با لغزیدن اکتین بر میوزین انجام می‌شود و به یون کلسیم و ATP نیاز دارد.",k:["ماهیچه‌ها با جفت‌های متضاد کار می‌کنند","ورزش استخوان را محکم‌تر می‌کند","ویتامین D جذب کلسیم را زیاد می‌کند"],x:"در بدن انسان بیش از ۶۰۰ ماهیچه و ۲۰۶ استخوان در بزرگسالی وجود دارد."}],

beh:[
{m:"غریزه‌ها الگوی ثابت عمل دارند و با یک محرک راه می‌افتند؛ جوجه‌اردک‌ها به اولین جسم متحرک دنبال می‌شوند (نقش‌پذیری، کار کنراد لورنز). در شرطی‌شدن کلاسیک، محرک خنثی با محرک طبیعی جفت می‌شود و پاسخ ایجاد می‌کند. در شرطی‌شدن فعال (اسکینر)، رفتاری که پاداش بگیرد تکرار می‌شود. یادگیری با درک و بینش هم در شامپانزه‌ها دیده می‌شود.",k:["عادی‌شدن ساده‌ترین نوع یادگیری است","پاداش رفتار را تقویت می‌کند","نقش‌پذیری در دوره‌ی حساس رخ می‌دهد"],x:"سگ با شنیدن صدای ظرف غذا بزاق ترشح می‌کند."},
{m:"ارتباط می‌تواند شنیداری، دیداری، شیمیایی یا لمسی باشد. نهنگ‌ها آوازهای دوربرد می‌خوانند، کرم شب‌تاب با نور ماده را جذب می‌کند و مورچه‌ها با رد فرومونی مسیر غذا را به هم‌لانه‌ای‌ها نشان می‌دهند. زنبور کارگر با رقص حلقوی یا هشت‌شکل محل منبع غذا را می‌گوید. نشانه‌ها باید برای گیرنده قابل فهم باشند و فایده‌ای تکاملی داشته باشند.",k:["فرومون‌ها پیام شیمیایی‌اند","رنگ و صدا برای جفت‌یابی و هشدار به کار می‌روند","ارتباط، همکاری را ممکن می‌کند"],x:"پرندگان هشدار خطر می‌دهند و گروه به سرعت پراکنده می‌شود."},
{m:"مهاجرت‌های فصلی برای رسیدن به غذا یا محل زادآوری است. پرستوها هزاران کیلومتر می‌روند و لاک‌پشت‌ها به ساحل زادگاه برمی‌گردند. آن‌ها از خورشید، ستارگان، میدان مغناطیسی زمین و بو کمک می‌گیرند. ساعت زیستی درونی ریتم خواب و بیداری را نزدیک به ۲۴ ساعت نگه می‌دارد و با نور تنظیم می‌شود.",k:["مهاجرت اغلب غریزی است","هورمون‌ها زمان مهاجرت را تنظیم می‌کنند","جت‌لگ نتیجه‌ی به‌هم‌خوردن ساعت زیستی است"],x:"پرستوی قطبی بیش از ۷۰ هزار کیلومتر در سال مهاجرت می‌کند."},
{m:"در جوامع حشرات اجتماعی مانند زنبور و موریانه، ملکه تولیدمثل می‌کند و کارگرها نازا هستند و کار می‌کنند. چنین ایثاری را می‌توان با شایستگی فراگیر توضیح داد: کارگرها ژن‌های مشترک با ملکه دارند و با کمک به او ژن‌های خود را حفظ می‌کنند. در پستانداران، گله‌ها از شکار و شکارچی محافظت می‌کنند و رهبری و سلسله‌مراتب نظم می‌دهد.",k:["کلنی تقسیم کار دارد","ایثار با ژن‌های مشترک توضیح داده می‌شود","گروه‌زیستی از شکارچی محافظت می‌کند"],x:"یک کندو ممکن است ده‌ها هزار زنبور و یک ملکه داشته باشد."},
{m:"در بسیاری از گونه‌ها، ماده‌ها پرهزینه‌تر تولیدمثل می‌کنند و گزینش‌گرترند، پس نرها برای جلب توجه رقابت یا خودنمایی می‌کنند. نمایش‌های پیچیده مانند رقص پرنده‌ی بهشتی یا شاخ‌های گوزن به ماده‌ها از سلامت ژنتیکی نر خبر می‌دهند. قلمروخواهی منابع را برای زادآوری حفظ می‌کند. مراقبت از فرزند در پرندگان و پستانداران هزینه دارد اما بقای نوزاد را بالا می‌برد.",k:["انتخاب جنسی به صفات نمایشی می‌انجامد","قلمرو منابع را حفظ می‌کند","مراقبت از نوزاد شایستگی را بالا می‌برد"],x:"نر طاووس هر سال دم زیبا و سنگین خود را می‌سازد تا جذب ماده شود."}],

evo:[
{m:"سه شرط انتخاب طبیعی: تنوع در جمعیت، وراثت‌پذیری آن تنوع و تفاوت در زادآوری. جمعیت‌هایی که شکارچی یا بیماری دارند، افرادی که صفت بهتری دارند بیشتر زنده می‌مانند و ژن‌هایشان فراوان‌تر می‌شود. مثال کلاسیک، پروانه‌ی فلفلی در انگلستان است که پس از صنعتی شدن و تیره شدن درخت‌ها، نوع تیره بیشتر شد. انتخاب طبیعی بر فنوتیپ اثر می‌گذارد، ولی تغییر در فراوانی ژن‌هاست.",k:["انتخاب بر جمعیت اثر می‌گذارد، نه فرد","سازگاری با محیط به معنی شایستگی بیشتر است","انتخاب جهت‌دار، پایدارکننده و گسسته‌کننده انواع آن هستند"],x:"باکتری‌های مقاوم به آنتی‌بیوتیک مثالی زنده از انتخاب طبیعی هستند."},
{m:"فسیل‌ها در لایه‌های رسوبی به ترتیب سن قرار گرفته‌اند و گونه‌های گذار مانند آرکئوپتریکس ویژگی‌های خزنده و پرنده را دارد. اندام‌های همتا مانند دست انسان، بال خفاش و باله‌ی نهنگ ساختار استخوانی مشابه دارند. همچنین شباهت توالی DNA و پروتئین‌ها شاخص دقیقی از خویشاوندی است؛ انسان و شامپانزه نزدیک ۹۸ تا ۹۹ درصد DNA مشترک دارند.",k:["فسیل سن و تاریخچه را نشان می‌دهد","اندام همتا از نیای مشترک است","مولکول‌ها خویشاوندی را تأیید می‌کنند"],x:"فسیل تیکتالیک حلقه‌ی گذار میان ماهی و چهارپایان است."},
{m:"گونه‌زایی دگرمیهنی با جدایی جغرافیایی رخ می‌دهد؛ مانند سهره‌های داروین در جزایر گالاپاگوس. گونه‌زایی هم‌میهنی بدون جدایی جغرافیایی و با چندلاد‌شدن، به‌ویژه در گیاهان، اتفاق می‌افتد. سدهای تولیدمثلی شامل تفاوت در زمان جفت‌گیری، رفتار، ناسازگاری گامت‌ها و نازایی دورگه‌هاست. وقتی گونه‌ای به محیط‌های متعدد می‌رسد، تابش سازشی رخ می‌دهد.",k:["جدایی جغرافیایی جریان ژن را قطع می‌کند","قاطر دورگه‌ی اسب و الاغ نازاست","تابش سازشی گونه‌های متنوع می‌سازد"],x:"سهره‌های گالاپاگوس منقارهای مختلفی برای غذاهای متفاوت دارند."},
{m:"رانش ژنی در جمعیت‌های کوچک بیشتر دیده می‌شود، مانند اثر بطری یا اثر بنیان‌گذار. در اثر بطری، جمعیت به دلیل بلا ناگهان کم می‌شود و تنوع ژنتیکی افت می‌کند، مانند یوزپلنگ‌ها. شرایط تعادل هاردی-واینبرگ شامل جمعیت بزرگ، آمیزش تصادفی، نبود جهش، مهاجرت و انتخاب است و اگر یکی نقض شود تکامل رخ می‌دهد. فرمول آن p²+2pq+q²=1 است.",k:["رانش تصادفی است","جریان ژن جمعیت‌ها را شبیه می‌کند","جهش تنوع تازه می‌سازد"],x:"در یک جزیره‌ی دورافتاده، چند مهاجر اولیه ژن‌های جمعیت بعدی را تعیین می‌کنند."},
{m:"انسان‌تباران از حدود ۶ میلیون سال پیش از میمون‌های آفریقایی جدا شدند. استرالوپیتکوس‌ها دوپا بودند و مغز کوچک داشتند. هومواِرکتوس ابزار ساخت و آتش را به کار برد و از آفریقا بیرون رفت. نئاندرتال‌ها در اروپا و غرب آسیا بودند و بخشی از ژنوم انسان‌های امروز غیرآفریقایی از آنهاست. انسان خردمند هنر، زبان و فرهنگ پیچیده دارد.",k:["دوپایی پیش از بزرگ‌شدن مغز بود","ابزارسازی و آتش مهم بودند","انسان‌ها با نئاندرتال‌ها آمیزش کردند"],x:"آثار باستانی غار در ایران، از دوران نئاندرتال‌ها نشانه‌هایی دارد."},
{m:"درخت فیلوژنی از داده‌های ریخت‌شناسی و مولکولی ساخته می‌شود. هر گره نشان‌دهنده‌ی نیای مشترک است و کلاد یعنی یک نیا و همه‌ی نوادگانش. انسان از نظر تکاملی به شامپانزه نزدیک‌تر از ماهی است و پرندگان به تمساح نزدیک‌ترند تا مارمولک، چون نیای مشترک جدیدتری دارند. با مقایسه‌ی ژن‌ها می‌توان زمان انشعاب را نیز تخمین زد (ساعت مولکولی).",k:["شاخه‌های درخت زمان و خویشاوندی را می‌رساند","نیای مشترک هر کلاد را می‌بندد","داده‌های ژنتیکی درخت‌ها را اصلاح کرده‌اند"],x:"درخت زندگی نشان می‌دهد قارچ‌ها از گیاهان به جانوران نزدیک‌ترند."}],

tax:[
{m:"سه قلمرو را کارل ووز بر پایه‌ی توالی RNA ریبوزومی تعریف کرد. باکتری‌ها و آرکی‌ها هر دو پیش‌هسته‌ای‌اند، ولی آرکی‌ها از نظر ژنتیکی به یوکاریوت‌ها نزدیک‌ترند. یوکاریوت‌ها شامل آغازیان، قارچ‌ها، گیاهان و جانوران‌اند. بسیاری از آرکی‌ها دما، نمک یا اسید زیاد را تحمل می‌کنند و در اعماق اقیانوس و منابع آب گرم یافت می‌شوند.",k:["قلمروها بر اساس ژنتیک تعریف شده‌اند","آرکی‌ها اغلب شرایط سخت را تحمل می‌کنند","باکتری و آرکی هسته ندارند"],x:"متان‌زاها آرکی‌هایی‌اند که در دستگاه گوارش گاو متان تولید می‌کنند."},
{m:"رده‌بندی لینه‌ای از قلمرو تا گونه ۸ سطح دارد: قلمرو، شاخه، رده، راسته، تیره، سرده، گونه. نام علمی دو‌اسمی به زبان لاتین است و به صورت ایتالیک (Homo sapiens) نوشته می‌شود. این نظام در همه‌ی کشورها یکسان است و از اشتباه جلوگیری می‌کند. امروزه تاکسونومی مدرن با استفاده از DNA رده‌ها را بازنگری می‌کند.",k:["نام علمی جهانی است","هر سطح شامل سطح‌های بعدی است","رده‌بندی مدرن فیلوژنتیک است"],x:"گربه‌ی خانگی Felis catus و شیر Panthera leo است؛ سرده‌ی متفاوت دارند."},
{m:"چند تعریف برای گونه وجود دارد. تعریف زیستی بر نبود آمیزش یا نازایی دورگه‌ها تکیه دارد. تعریف ریخت‌شناسی بر شباهت ظاهری و تعریف فیلوژنتیک بر تاریخچه‌ی مشترک. برخی گونه‌ها در طبیعت دورگه می‌دهند، مثل شیر و ببر در اسارت (لایگر). در باکتری‌ها که غیرجنسی‌اند تعریف زیستی کاربرد ندارد.",k:["هیچ تعریفی کامل نیست","دورگه‌ها معمولاً نازا هستند","مرز گونه‌ها در طبیعت گاه نامشخص است"],x:"قاطر دورگه‌ی اسب ماده و الاغ نر است و معمولاً نازاست."},
{m:"انقراض طبیعی همیشه بوده، اما نرخ آن اکنون بسیار بیشتر است و بعضی دانشمندان از ششمین انقراض دسته‌جمعی سخن می‌گویند. عوامل اصلی شامل تخریب و تکه‌تکه‌شدن زیستگاه، شکار بی‌رویه، آلودگی، گونه‌های مهاجم و تغییر اقلیم‌اند. اتحادیه‌ی جهانی حفاظت از طبیعت (IUCN) فهرست سرخ گونه‌ها را منتشر می‌کند. حفاظت از زیستگاه موثرترین راه است.",k:["زیستگاه مهم‌ترین عامل است","فهرست سرخ وضعیت گونه‌ها را می‌گوید","احیای گونه‌ها ممکن اما دشوار است"],x:"یوزپلنگ آسیایی تنها در ایران زنده است و کمتر از ۵۰ قلاده دارد."},
{m:"نقاط داغ، مناطقی با گونه‌های بومی بسیار و در معرض تهدیدند. جنگل‌های حاره، صخره‌های مرجانی و جزایر نمونه‌اند. ایران به دلیل کوهستان، کویر، جنگل‌های هیرکانی و خلیج فارس تنوع زیستی بالایی دارد. گونه‌های بومی در هیچ جای دیگر جهان یافت نمی‌شوند. حفاظت از آن‌ها در پارک‌ها و مناطق حفاظت‌شده انجام می‌شود.",k:["گونه‌ی بومی فقط در یک منطقه است","جنگل هیرکانی میراث جهانی است","تنوع ژنتیکی اساس پایداری است"],x:"جنگل‌های هیرکانی شمال ایران در فهرست میراث جهانی یونسکو ثبت شده‌اند."}],

eco:[
{m:"یک فرد گونه‌ی خود را نمایندگی می‌کند، جمعیت همه‌ی افراد یک گونه در یک ناحیه‌اند، جامعه شامل همه‌ی جمعیت‌های آن ناحیه است و بوم‌سازگان جامعه را به همراه عوامل غیرزنده در بر می‌گیرد. زیست‌بوم مجموعه‌ای بزرگ با اقلیم مشابه است، مانند بیابان یا تایگا. زیست‌کره مجموعه‌ی همه‌ی بوم‌سازگان‌های زمین است. عوامل زنده و غیرزنده با هم اثر متقابل دارند.",k:["جمعیت یک گونه است","جامعه چند گونه دارد","بوم‌سازگان عوامل غیرزنده را هم دارد"],x:"یک برکه، بوم‌سازگانی کوچک شامل ماهی، گیاه، میکروب، آب و نور است."},
{m:"تولیدکننده‌ها قند می‌سازند، مصرف‌کننده‌های اول گیاه‌خوارند، مصرف‌کننده‌های بعدی گوشتخوارند و تجزیه‌کننده‌ها مواد را بازیافت می‌کنند. در هر سطح غذایی بخش زیادی انرژی به صورت گرما و تنفس از بین می‌رود، پس زنجیره‌ها معمولاً کوتاه‌اند. شبکه‌ی غذایی ارتباط واقعی‌تری از چند زنجیره است. تجمع زیستی مواد سمی مانند جیوه در سطوح بالا بیشتر می‌شود.",k:["انرژی یک‌طرفه و مواد چرخه‌ای‌اند","هرم زیست‌توده نیز وجود دارد","شکارچی بالا بیشترین سم را جمع می‌کند"],x:"نهنگ‌های بزرگ از موجودات ریز پلانکتون تغذیه می‌کنند و زنجیره‌ی کوتاهی دارند."},
{m:"در چرخه‌ی کربن، گیاهان CO₂ را جذب و جانداران آن را آزاد می‌کنند و سوزاندن سوخت فسیلی سطح CO₂ را بالا می‌برد. در چرخه‌ی نیتروژن، باکتری‌های تثبیت‌کننده N₂ را به آمونیوم تبدیل می‌کنند، نیترات‌ساز آن را به نیترات می‌رساند و باکتری‌های نیترات‌زدا دوباره گاز می‌سازند. فسفر از سنگ‌ها وارد چرخه می‌شود. کودهای زیاد باعث یوتریفیکاسیون و مرگ آبزیان می‌شود.",k:["سوخت فسیلی چرخه‌ی کربن را به هم می‌زند","باکتری‌ها در چرخه‌ی نیتروژن اساسی‌اند","کود اضافه آب را آلوده می‌کند"],x:"رشد انفجاری جلبک‌ها در دریاچه‌ها نتیجه‌ی ورود زیاد فسفات و نیترات است."},
{m:"رشد نمایی در حضور منابع فراوان رخ می‌دهد، اما منابع محدودند و جمعیت در نهایت به ظرفیت تحمل می‌رسد. عوامل وابسته به تراکم مانند رقابت و بیماری با شلوغی افزایش می‌یابند، و عوامل مستقل از تراکم مانند آتش‌سوزی یا سیل بر همه‌ی افراد اثر می‌گذارند. جمعیت انسان از میلیارد اول تا هشتم، با فناوری و کشاورزی بسیار سریع رشد کرده است.",k:["ظرفیت تحمل سقف جمعیت است","شکارچی و طعمه نوسان‌های دوره‌ای دارند","رشد نمایی در منابع محدود پایدار نیست"],x:"جمعیت خرگوش و روباه در شمال کانادا نوسان‌های هماهنگ دارند."},
{m:"جنگل‌های بارانی گرم و پربارانند و بیشترین تنوع را دارند، بیابان‌ها بارش کم و گونه‌های سازگار دارند، تایگا جنگل سوزنی‌برگ سرد است، تندرا یخ‌زده و بدون درخت است و علفزارها بزرگ‌ترین دام‌ها را پرورش می‌دهند. آب‌های شیرین شامل رودخانه و دریاچه و تالاب‌اند و دریاها شامل صخره‌ی مرجانی تا ژرفای تاریک. تالاب‌ها فیلتر طبیعی آب‌اند و سیل را کم می‌کنند.",k:["اقلیم نوع زیست‌بوم را می‌سازد","مرجان‌ها تنوع آبی بالایی دارند","تالاب‌ها بسیار ارزشمندند"],x:"تالاب انزلی و هورالعظیم از تالاب‌های ارزشمند منطقه‌ی ما هستند."},
{m:"CO₂، متان و بخار آب گازهای گلخانه‌ای هستند که گرما را در جو نگه می‌دارند. فعالیت انسان این گازها را زیاد کرده و میانگین دمای زمین بالا رفته است. پیامدها شامل ذوب یخچال‌ها، بالا آمدن آب دریاها، خشکسالی و سیل، سفیدشدگی مرجان‌ها و جابه‌جایی زیستگاه گونه‌هاست. راه‌حل‌ها: انرژی خورشیدی و بادی، بهره‌وری انرژی، جنگل‌کاری و حفاظت از تالاب‌ها.",k:["گرمایش جهانی علت انسانی دارد","اسیدی‌شدن اقیانوس‌ها مرجان را می‌کشد","کاهش مصرف و بازیافت ضروری است"],x:"درخت‌کاری و حفاظت از جنگل‌ها، کربن را در درازمدت ذخیره می‌کند."}],

bio:[
{m:"در مهندسی ژنتیک، آنزیم برشی DNA را در جایگاه ویژه‌ای می‌برد، قطعه‌ی ژن مورد نظر به پلاسمید متصل می‌شود (DNA نوترکیب) و آنزیم لیگاز آن‌ها را می‌چسباند. پلاسمید به باکتری وارد می‌شود و باکتری ژن را بیان می‌کند. محصولاتی مانند انسولین، هورمون رشد و واکسن هپاتیت B به این شیوه ساخته می‌شوند. گیاهان تراریخته نیز با همین فناوری ساخته می‌شوند.",k:["آنزیم‌های برشی قیچی مولکولی‌اند","لیگاز چسب مولکولی است","باکتری‌ها کارخانه‌ی دارو می‌شوند"],x:"پیش از این، انسولین را از لوزالمعده‌ی گاو و خوک استخراج می‌کردند."},
{m:"PCR با سه مرحله‌ی تکرارشونده کار می‌کند: واسرشت‌سازی در دمای بالا، اتصال آغازگر در دمای پایین‌تر و گسترش با DNA پلیمراز مقاوم به گرما. پس از ۳۰ چرخه میلیاردها نسخه به دست می‌آید. الکتروفورز ژل قطعات DNA را بر اساس اندازه جدا می‌کند و برای آزمایش‌های هویت و تشخیص بیماری به کار می‌رود. توالی‌یابی نسل جدید ژنوم کامل را در چند ساعت می‌خواند.",k:["PCR نیاز به آغازگر دارد","الکتروفورز قطعات را بر اساس اندازه جدا می‌کند","اثر انگشت DNA هویت را مشخص می‌کند"],x:"تشخیص ویروس‌ها از نمونه‌ی بینی با PCR انجام می‌شود."},
{m:"سلول‌های بنیادی جنینی می‌توانند به همه‌ی سلول‌ها تبدیل شوند، و سلول‌های بنیادی بزرگسالان مانند مغز استخوان فقط چند نوع. در سال ۲۰۰۶ دانشمندان توانستند سلول‌های پوست را به سلول‌های پرتوان القایی (iPS) بازبرنامه‌ریزی کنند، که بدون نابودی جنین به دست می‌آیند. کاربردها: پیوند مغز استخوان برای سرطان خون، ترمیم پوست سوخته و مدل‌سازی بیماری در آزمایشگاه. کلونینگ تولید جانداری هم‌ژن با جاندار دیگر است، مانند میش دالی.",k:["iPS بدون جنین ساخته می‌شود","پیوند مغز استخوان از سلول‌های بنیادی است","کلونینگ هسته را به تخمک بدون هسته می‌برد"],x:"میش دالی نخستین پستاندار کلون‌شده از سلول بالغ بود (۱۹۹۶)."},
{m:"بیوانفورماتیک با الگوریتم‌ها توالی‌ها را مقایسه می‌کند. با ابزارهایی مانند BLAST می‌توان یک توالی ناشناخته را با پایگاه داده‌ی جهانی مقایسه کرد. پیش‌بینی ساختار پروتئین با هوش مصنوعی (مانند آلفافولد) یکی از بزرگ‌ترین پیشرفت‌های اخیر است و طراحی دارو را سریع‌تر کرده است. تحلیل داده‌های ژنوم، سلامت شخصی‌شده و شناخت بیماری‌ها را ممکن می‌کند.",k:["بیوانفورماتیک زیست و رایانه است","پایگاه داده‌ها داده‌ی عمومی دارند","هوش مصنوعی شکل پروتئین‌ها را حدس می‌زند"],x:"پروژه‌ی ژنوم انسان ۱۳ سال طول کشید؛ امروز چند ساعت."},
{m:"گیاهان تراریخته مقاوم به آفت یا خشکی، برنج غنی از ویتامین و گندم پرمحصول ساخته شده‌اند. در صنعت، تخمیر برای تولید نان، ماست، آنزیم و دارو به کار می‌رود. بیوگاز و بیواتانول سوخت‌های زیستی هستند و زیست‌پالایی از میکروب‌ها برای پاکسازی نفت و فلزات سنگین بهره می‌برد. نگرانی‌های اخلاقی و زیست‌محیطی باید با پژوهش و قانون مدیریت شود.",k:["تراریخته‌ها ژن بیگانه دارند","تخمیر در صنایع غذا و دارو مهم است","زیست‌پالایی آلودگی را با میکروب پاک می‌کند"],x:"برای ساخت پنیر، آنزیم رنت نوترکیب باکتری‌ها جایگزین رنت گوساله شد."},
{m:"روش علمی با مشاهده و پرسش شروع می‌شود، سپس فرضیه‌ی آزمون‌پذیر طرح می‌شود. در آزمایش، یک متغیر مستقل تغییر می‌کند و متغیر وابسته اندازه‌گیری می‌شود و بقیه عوامل ثابت می‌ماند. گروه شاهد برای مقایسه ضروری است. داده‌ها آماری تحلیل می‌شوند و نتایج برای داوری همتایان منتشر می‌شود. میکروسکوپ نوری تا ۱۰۰۰ برابر و الکترونی تا میلیون‌ها برابر بزرگ می‌کند.",k:["فرضیه باید قابل ابطال باشد","تکرارپذیری پایه‌ی اعتبار است","میکروسکوپ الکترونی ساختارهای ریزتر را نشان می‌دهد"],x:"لوئی پاستور با آزمایش فلاسک گردن‌قوی، پیدایش خودبه‌خودی میکروب‌ها را رد کرد."}]
};

var $=function(s,r){return (r||document).querySelector(s)};
var fa=function(n){return Number(n).toLocaleString("fa")};
var store={get:function(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set:function(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
var done=store.get("zy-done")||{}, seen=store.get("zy-seen")||{};
var byId={};
D.forEach(function(c,ci){
  byId[c.id]=c;
  c.topics=c.topics.map(function(t,i){var x=(X[c.id]||[])[i]||{};return {t:t[0],d:t[1],terms:t[2],m:x.m||"",k:x.k||[],x:x.x||""}});
});
function allTopics(){var n=0;D.forEach(function(c){n+=c.topics.length});return n}

/* nav chips */
var chips=$("#chips");
D.forEach(function(c){var b=document.createElement("button");b.type="button";b.className="chip";b.style.setProperty("--h",c.h);b.textContent=c.name.split("؛")[0];b.dataset.id=c.id;b.onclick=function(){go(c.id,0)};chips.appendChild(b)});
$("#home").onclick=function(){go(null)};
$("#theme").onclick=function(){var r=document.documentElement,d=r.dataset.theme==="dark"||(!r.dataset.theme&&matchMedia("(prefers-color-scheme:dark)").matches);r.dataset.theme=d?"light":"dark"};

var app=$("#app"),state={ch:null,i:0};

function go(id,i,noScroll){
  state.ch=id;state.i=i||0;
  try{var h=id?("#"+id+"-"+state.i):"#";if(location.hash!==h)history.replaceState(null,"",h==="#"?location.pathname+location.search:h)}catch(e){}
  render();
  if(!noScroll){var hero=$("#hero");var top=id?0:0;window.scrollTo({top:top,behavior:"auto"})}
}

function render(){
  var c=state.ch?byId[state.ch]:null;
  $("#hero").hidden=!!c;
  chips.querySelectorAll(".chip").forEach(function(b){b.classList.toggle("on",!!c&&b.dataset.id===c.id)});
  if(!c)renderHome();else renderChapter(c);
}

function seenCount(c){return (seen[c.id]||[]).length}
function markSeen(c,i){if(i>=c.topics.length)return;var a=seen[c.id]=seen[c.id]||[];if(a.indexOf(i)<0){a.push(i);store.set("zy-seen",seen)}}

/* home */
function renderHome(){
  var h='<div class="wrap"><div class="tools"><div class="search"><input id="q" type="search" placeholder="جست‌وجو در همه‌ی مباحث؛ مثلاً: میتوکندری، CRISPR، فتوسنتز" aria-label="جست‌وجو"></div><div class="progress"><span id="ptext"></span><div class="bar"><i id="pbar"></i></div></div></div>';
  h+='<div id="mapbox"><h2 class="sec-title">نقشه‌ی فصل‌ها</h2><p class="sec-sub">از کوچک‌ترین مقیاس به بزرگ‌ترین. یک فصل را انتخاب کنید.</p><div class="map">';
  D.forEach(function(c){
    var s=seenCount(c),n=c.topics.length;
    h+='<button class="ccard" type="button" data-id="'+c.id+'" style="--h:'+c.h+'"><small>'+c.tag+'</small><h3>'+c.name+'</h3><span class="sc">مقیاس: '+c.scale+'</span><div class="meta"><span class="pill">'+fa(n)+' مبحث</span><span>'+(done[c.id]!=null?"آزمون: "+fa(done[c.id])+" از "+fa(c.quiz.length):"آزمون دارد")+'</span></div><div class="pb"><i style="width:'+(s/n*100)+'%"></i></div></button>';
  });
  h+='</div></div><div class="results" id="results"></div><div class="empty" id="empty">مبحثی با این عبارت پیدا نشد.</div></div>';
  app.innerHTML=h;
  app.querySelectorAll(".ccard").forEach(function(b){b.onclick=function(){go(b.dataset.id,0)}});
  updateProgress();
  $("#q").addEventListener("input",function(e){search(e.target.value)});
}
function updateProgress(){
  var t=0,s=0;D.forEach(function(c){t+=c.topics.length;s+=seenCount(c)});
  var pt=$("#ptext"),pb=$("#pbar");if(!pt)return;
  var q=0;D.forEach(function(c){if(done[c.id]!=null)q++});
  pt.textContent="مباحث خوانده‌شده: "+fa(s)+" از "+fa(t)+"  ·  آزمون‌ها: "+fa(q)+" از "+fa(D.length);
  pb.style.width=((s+q)/(t+D.length)*100)+"%";
}
function search(v){
  v=v.trim().toLowerCase();
  var res=$("#results"),box=$("#mapbox"),emp=$("#empty");
  if(!v){res.style.display="none";box.style.display="";emp.style.display="none";return}
  var out=[];
  D.forEach(function(c){c.topics.forEach(function(t,i){
    var hay=(t.t+" "+t.d+" "+t.m+" "+t.terms.join(" ")+" "+t.k.join(" ")+" "+t.x).toLowerCase();
    if(hay.indexOf(v)>-1)out.push({c:c,i:i,t:t});
  })});
  box.style.display="none";
  res.innerHTML="";res.style.display=out.length?"flex":"none";emp.style.display=out.length?"none":"block";
  out.forEach(function(r){
    var b=document.createElement("button");b.type="button";b.className="res";b.style.setProperty("--h",r.c.h);
    b.innerHTML='<em>'+r.c.name+'</em><b>'+r.t.t+'</b><span>'+r.t.d.slice(0,110)+'…</span>';
    b.onclick=function(){go(r.c.id,r.i)};res.appendChild(b);
  });
}

/* chapter */
function renderChapter(c){
  var n=c.topics.length,i=Math.max(0,Math.min(state.i,n+1));state.i=i;
  markSeen(c,i);
  var h='<div class="cv" style="--h:'+c.h+'"><div class="band"><div class="wrap"><button class="back" type="button" id="back">← همه‌ی فصل‌ها</button><div class="scale"><b>'+c.tag+'</b><span class="rule"></span><span>مقیاس: '+c.scale+'</span></div><h2>'+c.name+'</h2><p>'+c.intro+'</p></div></div>';
  h+='<div class="wrap"><div class="layout"><div class="list" role="tablist">';
  c.topics.forEach(function(t,j){h+='<button type="button" role="tab" class="li'+(j===i?" on":"")+((seen[c.id]||[]).indexOf(j)>-1?" seen":"")+'" data-i="'+j+'" style="--n:'+j+'"><span class="d"></span>'+t.t+'</button>'});
  h+='<button type="button" role="tab" class="li sp'+(i===n?" on":"")+'" data-i="'+n+'" style="--n:'+n+'"><span class="d"></span>می‌دانستید؟</button>';
  h+='<button type="button" role="tab" class="li sp'+(i===n+1?" on":"")+'" data-i="'+(n+1)+'" style="--n:'+(n+1)+'"><span class="d"></span>آزمون این فصل</button>';
  h+='</div><article class="panel" id="panel"></article></div></div></div>';
  app.innerHTML=h;
  $("#back").onclick=function(){go(null)};
  app.querySelectorAll(".li").forEach(function(b){b.onclick=function(){go(c.id,+b.dataset.i,true);scrollPanel()}});
  fillPanel(c,i);
}
function scrollPanel(){
  var p=$("#panel");if(!p)return;var r=p.getBoundingClientRect();
  if(r.top<60||r.top>window.innerHeight*0.7)p.scrollIntoView({block:"start"});
}
function fillPanel(c,i){
  var n=c.topics.length,p=$("#panel"),h="";
  if(i<n){
    var t=c.topics[i];
    h+='<div class="kick"><i></i>مبحث '+fa(i+1)+' از '+fa(n)+'</div><h3>'+t.t+'</h3><p class="l1">'+t.d+'</p>';
    if(t.m)h+='<p>'+t.m+'</p>';
    if(t.k.length){h+='<h4>نکته‌های کلیدی</h4><div class="keys">';t.k.forEach(function(k,j){h+='<div class="key" style="--n:'+j+'"><b>'+fa(j+1)+'</b>'+k+'</div>'});h+='</div>'}
    if(t.x)h+='<h4>مثال</h4><div class="ex"><b>به یاد بسپارید</b>'+t.x+'</div>';
    h+='<h4>واژه‌های کلیدی</h4><div class="terms">'+t.terms.map(function(x,j){return '<span style="--n:'+j+'">'+x+'</span>'}).join("")+'</div>';
  }else if(i===n){
    h+='<div class="kick"><i></i>نکته‌ی شگفت‌انگیز</div><h3>می‌دانستید؟</h3><p class="bigfact">'+c.fact+'</p>';
  }else{
    h+='<div class="kick"><i></i>خودآزمایی</div><h3>آزمون '+c.hl+'</h3><div id="qz"></div>';
  }
  var prev=i>0?'<button class="pg" type="button" id="pv">→ قبلی</button>':'<span></span>';
  var next=i<n+1?'<button class="pg" type="button" id="nx">بعدی ←</button>':'<span></span>';
  h+='<div class="pager">'+next+prev+'</div>';
  p.innerHTML=h;
  var pv=$("#pv",p),nx=$("#nx",p);
  if(pv)pv.onclick=function(){go(c.id,i-1,true);scrollPanel()};
  if(nx)nx.onclick=function(){go(c.id,i+1,true);scrollPanel()};
  if(i===n+1)startQuiz(c,$("#qz",p));
}

function startQuiz(c,box){
  var k=0,score=0;
  function show(){
    if(k>=c.quiz.length){
      done[c.id]=Math.max(done[c.id]||0,score);store.set("zy-done",done);
      box.innerHTML='<p class="qtext">نمره‌ی شما: '+fa(score)+' از '+fa(c.quiz.length)+(score===c.quiz.length?" . عالی بود!":"")+'</p><button class="next" type="button" id="again">دوباره</button>';
      $("#again",box).onclick=function(){k=0;score=0;show()};return;
    }
    var q=c.quiz[k];
    box.innerHTML='<p class="expl" style="margin:0">پرسش '+fa(k+1)+' از '+fa(c.quiz.length)+'</p><p class="qtext">'+q.q+'</p><div class="opts"></div><p class="expl" hidden></p><div id="nz"></div>';
    var o=$(".opts",box);
    q.o.forEach(function(t,j){
      var b=document.createElement("button");b.type="button";b.className="opt";b.textContent=t;
      b.onclick=function(){
        var all=o.querySelectorAll(".opt");all.forEach(function(x){x.disabled=true});
        all[q.a].classList.add("ok");if(j!==q.a)b.classList.add("no");else score++;
        var e=$(".expl[hidden]",box);e.textContent=q.e;e.hidden=false;
        var nb=document.createElement("button");nb.type="button";nb.className="next";nb.textContent=k+1<c.quiz.length?"پرسش بعد":"دیدن نمره";
        nb.onclick=function(){k++;show()};$("#nz",box).appendChild(nb);nb.focus({preventScroll:true});
      };o.appendChild(b);
    });
  }
  show();
}

/* start from hash */
(function(){
  var m=(location.hash||"").match(/^#([a-z]+)-(\d+)$/);
  if(m&&byId[m[1]])go(m[1],+m[2],true);else render();
  addEventListener("hashchange",function(){
    var m=(location.hash||"").match(/^#([a-z]+)-(\d+)$/);
    if(m&&byId[m[1]]){if(state.ch!==m[1]||state.i!==+m[2])go(m[1],+m[2])}
    else if(state.ch)go(null);
  });
})();

/* hero cells */
(function(){
  var cv=$("#cells"),cx=cv.getContext("2d"),W,H,cells=[],dpr=Math.min(devicePixelRatio||1,2);
  function size(){var r=cv.getBoundingClientRect();W=r.width;H=r.height;cv.width=W*dpr;cv.height=H*dpr;cx.setTransform(dpr,0,0,dpr,0,0)}
  function mk(){return {x:Math.random()*W,y:Math.random()*H,r:8+Math.random()*34,vx:(Math.random()-.5)*.25,vy:(Math.random()-.5)*.25,p:Math.random()*6.28,hue:Math.random()*360}}
  function draw(t){
    if(!W)return;cx.clearRect(0,0,W,H);
    cells.forEach(function(c){
      c.x+=c.vx;c.y+=c.vy;if(c.x<-50)c.x=W+50;if(c.x>W+50)c.x=-50;if(c.y<-50)c.y=H+50;if(c.y>H+50)c.y=-50;
      var r=c.r*(1+Math.sin(t/1400+c.p)*.05);
      cx.beginPath();cx.arc(c.x,c.y,r,0,6.283);cx.fillStyle="hsla("+c.hue+",80%,60%,.10)";cx.fill();
      cx.strokeStyle="hsla("+c.hue+",90%,72%,.5)";cx.lineWidth=1.3;cx.stroke();
      cx.beginPath();cx.arc(c.x+r*.2,c.y-r*.15,r*.32,0,6.283);cx.fillStyle="hsla("+((c.hue+40)%360)+",95%,70%,.38)";cx.fill();
    });
  }
  function init(){size();var n=Math.round(W*H/15000);cells=[];for(var i=0;i<n;i++)cells.push(mk());draw(0)}
  init();addEventListener("resize",init);
  if(!matchMedia("(prefers-reduced-motion:reduce)").matches){(function loop(t){if(!document.hidden||1)draw(t);requestAnimationFrame(loop)})(0)}
})();
</script>
